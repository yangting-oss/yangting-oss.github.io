/* ==================================================================
 * 抓取引擎：RSS → 提炼 → 写入知识库/热点
 * ================================================================== */
const RSS_SOURCES = {
  hr:     ['https://www.ruanyifeng.com/blog/atom.xml', 'https://www.ifanr.com/feed'],
  policy: ['https://www.ruanyifeng.com/blog/atom.xml', 'https://www.ithome.com/rss/'],
  tech:   ['https://www.ifanr.com/feed', 'https://sspai.com/feed', 'https://www.ithome.com/rss/'],
  health: ['https://sspai.com/feed', 'https://www.ruanyifeng.com/blog/atom.xml'],
};
function stripHtml(s){
  return String(s||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/&[a-z]+;/gi,' ').replace(/\s+/g,' ').trim();
}
function distill(title, desc, feed){
  const text = stripHtml(desc);
  const summary = text.slice(0, 100);
  const sents = text.split(/[。！？；\n]/).map(s => s.trim()).filter(s => s.length >= 8);
  const points = sents.slice(0, 3).map(s => s.length > 46 ? s.slice(0, 44) + '…' : s);
  const tags = (feed.kw||[]).filter(k => (title + text).toLowerCase().includes(k.toLowerCase())).slice(0,3);
  return { summary, points, tags };
}
async function fetchRss(url){
  /* 优先 rss2json（免 CORS），失败回退 allorigins + DOMParser */
  try {
    const res = await fetchWithTimeout(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`, 9000);
    if (res.ok) {
      const j = await res.json();
      if (j.status === 'ok' && Array.isArray(j.items)) return j.items.slice(0, 20).map(it => ({ title:stripHtml(it.title), desc: it.description||it.content||'', link: it.link||'' }));
    }
  } catch(e){}
  try {
    const res = await fetchWithTimeout(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, 9000);
    if (res.ok) {
      const xml = await res.text();
      const doc = new DOMParser().parseFromString(xml, 'text/xml');
      return [...doc.querySelectorAll('item, entry')].slice(0,20).map(it => ({
        title: stripHtml(it.querySelector('title')?.textContent),
        desc: it.querySelector('description, summary, content')?.textContent || '',
        link: it.querySelector('link')?.textContent || ''
      }));
    }
  } catch(e){}
  throw new Error('rss failed');
}
function fetchWithTimeout(url, ms, opts){
  return Promise.race([
    fetch(url, opts||{}),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
  ]);
}
let feedRunning = false;
function jobDue(f){
  const now = new Date();
  const hm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const j = (S.jobs||{})[f.id] || {};
  if (j.lastDate === today()) return false;
  if (f.run === 'daily') return hm >= (f.time||'08:00');
  if (f.run === 'weekly') return (f.weekdays||[]).includes(now.getDay()) && hm >= (f.time||'09:00');
  return false;
}
async function runFeedNow(feedId, silent){
  if (feedRunning) return;
  const feed = dt('feeds').find(f => f.id === feedId);
  if (!feed) return;
  if (!S.settings.feeds) { if (!silent) toast('自动抓取总开关已关闭（设置中开启）'); return; }
  if (feed.id === 'hot') return runHotFeed(silent);
  feedRunning = true;
  if (!silent) toast(`${feed.emoji} 正在抓取「${feed.name}」…`);
  let items = [], got = false;
  for (const url of (RSS_SOURCES[feed.id] || [])) {
    try {
      const raw = await fetchRss(url);
      items = items.concat(raw); got = true;
      if (items.length >= 24) break;
    } catch(e){}
  }
  let added = 0;
  if (got && items.length) {
    /* 关键词过滤 + 打分：标题命中权重高 */
    let picked = items;
    if ((feed.kw||[]).length) {
      picked = items
        .map(it => ({ it, score: feed.kw.reduce((s,k) => s + ((it.title||'').toLowerCase().includes(k.toLowerCase()) ? 2 : 0) + (((it.desc||'')||'').toLowerCase().includes(k.toLowerCase()) ? 1 : 0), 0) }))
        .filter(x => x.score > 0).sort((a,b) => b.score - a.score).map(x => x.it);
      if (!picked.length) picked = items.slice(0, 6);
    }
    picked = picked.slice(0, 4);
    const fresh = [];
    picked.forEach((it, i) => {
      if (!it.title) return;
      const d = distill(it.title, it.desc, feed);
      fresh.push({
        id: uid(), feedId: feed.id, auto: true, date: today(),
        title: it.title, summary: d.summary, points: d.points, tags: d.tags,
        content: '', source: stripHtml(it.link ? new URL(it.link, location.href).hostname : feed.name),
        url: it.link || '', category: feed.name
      });
    });
    /* 去重：同一天同频道不重复同名 */
    const exist = new Set(dt('kb').filter(x => x.feedId === feed.id && x.date === today()).map(x => x.title));
    const toAdd = fresh.filter(x => !exist.has(x.title));
    if (toAdd.length) {
      update({ ...S, kb:[...toAdd, ...S.kb] });
      added = toAdd.length;
    }
    update({ ...S, jobs: { ...(S.jobs||{}), [feed.id]: { lastDate: today(), lastTs: Date.now(), lastCount: added, ok: true } } });
    if (!silent) toast(`${feed.emoji} ${feed.name}：新增 ${added} 条${added ? '，已写入知识库' : '（今日已是最全）'}`);
  } else {
    /* 抓取失败：如实记录状态，不写入任何内容 */
    update({ ...S, jobs: { ...(S.jobs||{}), [feed.id]: { lastDate: today(), lastTs: Date.now(), lastCount: 0, ok: false } } });
    if (!silent) toast(`${feed.emoji} ${feed.name}：抓取失败（源不可达），今日不写入内容`);
  }
  feedRunning = false;
  render();
}
async function runAllFeeds(silent){
  for (const f of dt('feeds').filter(f => f.enabled)) {
    await runFeedNow(f.id, silent);
  }
  if (!silent) toast('🍊 全部频道已更新');
}
async function runDueJobs(){
  const due = dt('feeds').filter(f => f.enabled && jobDue(f));
  for (const f of due) {
    await runFeedNow(f.id, true);
    toast(`${f.emoji} 每日任务已执行：「${f.name}」更新完成`);
  }
}

/* ---------- 每日热榜/资讯引擎（news.topurl.cn 公益 API + hitokoto，真实全网数据；CORS OK，无需密钥） ---------- */
/* 单一接口覆盖：精选新闻列表 + 每日日历 + 每日一语 + 每日一句 + 一行诗 + 天气 */
const TOPURL = 'https://news.topurl.cn/api';
const fmtHot = n => !n ? '' : n >= 10000 ? (n/10000).toFixed(1).replace(/\.0$/,'') + 'w' : String(n);
let boardBusy = false;
async function fetchTopurl(){
  const res = await fetchWithTimeout(TOPURL, 10000);
  const j = await res.json();
  if (!j || j.code !== 200 || !j.data) throw new Error('bad topurl resp');
  return j.data;
}
function topurlToBoards(data){
  /* news.topurl.cn → 统一 boards 结构（兼容旧 UI） */
  const items = (data.newsList||[]).map(x => ({
    t: String(x.title||'').slice(0, 70),
    v: x.score || 0,
    l: x.url || '',
    c: x.category || '',
  })).filter(x => x.t);
  return { news: items };                 /* 单源，但仍用 boards.boards.news 存，兼容旧逻辑 */
}
async function ensureBoards(force, silent){
  if (!force && !S.settings.feeds) return false;
  const b = S.boards || {};
  if (!force && b.date === today()) return true;
  if (boardBusy) return false;
  boardBusy = true;
  try {
    const data = await fetchTopurl();
    const boards = topurlToBoards(data);
    const news = boards.news;
    if (!news || !news.length) throw new Error('empty list');
    const bh = { ...(S.boardsHist||{}) };
    if (b.date && b.date !== today() && b.boards) bh[b.date] = b;
    Object.keys(bh).sort().slice(0, -7).forEach(k => delete bh[k]);
    update({ ...S, boards: { date: today(), ts: Date.now(), boards }, boardsHist: bh, boardErr: null });
    if (!silent) toast(`📡 精选新闻已更新（${news.length} 条）`);
    boardBusy = false; render();
    return true;
  } catch(e) {
    update({ ...S, boardErr: { date: today(), ts: Date.now() } });
    if (!silent) toast('📡 精选新闻抓取失败，可点按钮重试');
    boardBusy = false; render();
    return false;
  }
}
async function runHotFeed(silent){
  feedRunning = true;
  if (!silent) toast('🔥 正在抓取精选新闻…');
  const ok = await ensureBoards(true, true);
  if (ok) {
    const src = ((S.boards||{}).boards||{}).news || [];
    const hotItems = src.slice(0, 8).map((x, i) => ({
      id: uid(), fetch_date: today(), title: x.t,
      summary: `${x.c||'精选'} · 第 ${i+1} 条${x.v?` · 热度 ${x.v}`:''}`,
      source: '自动抓取 · 精选新闻', hot_rank: i+1, url: x.l||''
    }));
    const others = dt('hotspots').filter(x => x.fetch_date !== today() || !String(x.source||'').startsWith('自动抓取'));
    update({ ...S, hotspots:[...hotItems, ...others],
      jobs: { ...(S.jobs||{}), hot: { lastDate: today(), lastTs: Date.now(), lastCount: hotItems.length, ok: true } } });
    if (!silent) toast('🔥 今日热榜已同步到「热点」页');
  } else {
    update({ ...S, jobs: { ...(S.jobs||{}), hot: { lastDate: today(), lastTs: Date.now(), lastCount: 0, ok: false } } });
    if (!silent) toast('🔥 热榜抓取失败，可点按钮重试');
  }
  feedRunning = false; render();
}
let newsBusy = false;
async function ensureDailyNews(force, silent){
  if (!force && !S.settings.feeds) return false;
  const n = S.dailyNews || {};
  if (!force && n.date === today()) return true;
  if (newsBusy) return false;
  newsBusy = true;
  try {
    const topurl = fetchTopurl();
    const hitokoto = fetchWithTimeout('https://v1.hitokoto.cn/?c=i&c=k&max_length=36', 8000).then(r => r.json()).catch(() => null);
    const [tu, hk] = await Promise.all([topurl, hitokoto]);
    if (!tu) throw new Error('topurl failed');
    const newsItems = (tu.newsList||[]).slice(0, 12);
    const quoteText = tu.phrase || tu.sentence || tu.poem || '';
    const calendar = tu.calendar || {};
    const lunar = calendar.cYear && calendar.monthCn
      ? `${calendar.cYear}年${calendar.cMonth}月${calendar.cDay}日 · ${calendar.ncWeek} · ${calendar.yearCn}${calendar.monthCn}${calendar.dayCn}${calendar.term?` · ${calendar.term}`:''}`
      : '';
    update({ ...S, dailyNews: {
      date: today(), ts: Date.now(),
      news: newsItems.map(x => `【${x.category||'精选'}】${String(x.title||'').slice(0,140)}`),
      tip: lunar,
      cover: '',
      quote: quoteText ? { t: String(quoteText).slice(0, 80), from: 'news.topurl.cn' }
             : (hk && hk.hitokoto ? { t: String(hk.hitokoto).slice(0, 60), from: String(hk.from||'').slice(0, 20) } : null),
      sentence: tu.sentence || '',
      poem: tu.poem || '',

function aiReady(){ return !!((S.vdCfg||{}).apiKey); }

async function aiChat(sys, user){
  const cfg = S.vdCfg||{};
  const res = await fetchWithTimeout(cfg.apiUrl||'https://api.deepseek.com/v1/chat/completions', 120000, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.apiKey },
    body: JSON.stringify({ model: cfg.model||'deepseek-chat', temperature: 0.7,
      messages:[ { role:'system', content: sys }, { role:'user', content: user } ] })
  });
  if (!res.ok) throw new Error('API 返回 ' + res.status);
  const j = await res.json();
  const txt = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').replace(/```json|```/g, '').trim();
  if (!txt) throw new Error('AI 返回为空');
  return txt;
}
function parseAiJson(txt, arr){

  return JSON.parse(m ? m[0] : txt);
}

function remHits(r){
  const now = new Date();
  const hm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  if (r.time !== hm || !r.enabled || r.lastFired === now.toDateString()) return false;
  const wd = now.getDay();
  if (r.repeat === 'weekday') return wd >= 1 && wd <= 5;
  if (r.repeat === 'weekly') return (r.weekdays||[]).includes(wd);
  return true;
}

    <div class="card card-pad" style="margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div class="meal-em">${kico('phone',24)}</div>
      <div style="flex:1"><b>PWA 离线模式</b><div class="small muted">本地应用，数据保存于浏览器，可安装到桌面</div></div>
      <span class="chip green">已启用</span>
    </div>
    <div class="card card-pad">
      <div class="sec-title">${kico('broom',18)} 数据工具</div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn sm" onclick="exportData()">${kico('upload',14)} 导出全部数据</button>
        <button class="btn sm" onclick="document.getElementById('importFile').click()">${kico('download',14)} 导入备份</button>
        <button class="btn sm" onclick="cleanFakeData()">🧹 清除演示假数据</button>
        <button class="btn sm danger" onclick="resetData()">清空全部数据</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
    </div>`;
};
function setPushTime(v){
  update({ ...S, settings:{ ...S.settings, push_time:v } }); toast('推送时间已设为 ' + v);
}
function setFeeds(on){
  update({ ...S, settings:{ ...S.settings, feeds:on } });
  toast(on ? '已开启自动抓取' : '已关闭自动抓取');
}
function setCloud(on){
  update({ ...S, settings:{ ...S.settings, cloud:on } });
  if (on) { toast('已开启云同步'); syncNow(); } else { toast('已关闭云同步，数据仅保存在本地'); }
}
function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `浅语迟噜噜工作台备份-${today()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('已导出全部数据');
}
function importData(input){
  const f = input.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || data._app !== 'alin-desk') throw new Error('bad');
      update({ ...emptyState(), ...data }); toast('导入成功');
    } catch(e) { toast('导入失败：文件格式不正确'); }
  };
  reader.readAsText(f); input.value = '';
}
function resetData(){
  if (!confirm('确定清空全部数据吗？\n\n注意：云端已有数据在下次同步时会合并回来；想彻底清空请先在上方关闭云同步。')) return;
  S = emptyState(); saveLocal(); dirty = true; schedulePush(); render(); toast('已清空全部数据');
}
/* ---------- 一键清除演示假数据（按特征精确匹配，只删演示模式写入的记录，手填数据不受影响） ---------- */
function cleanFakeData(){
  if (!confirm('将按特征清除早期演示模式写入的假数据：\n\n· 账单（牛肉面 / 地铁 / 10月工资）\n· 饮食（燕麦牛奶+水煮蛋 / 牛肉面 / 一杯奶茶）\n· 健身（瑜伽45分 / 羽毛球60分 / 力量训练75分）\n· 公众号示例文章（丁香医生等3篇）\n\n你手动填写的真实数据不受影响，继续吗？')) return;
  const ids = [];
  const fpBill = new Set(['午餐 - 牛肉面','地铁','10月工资']);
  const fpDiet = new Set(['燕麦牛奶 + 水煮蛋','牛肉面','一杯奶茶']);
  const fpGz   = new Set(['为什么你总是睡前刷手机','写给职场新人的沟通清单','一枚 HR 的面试手记']);
  const woDemo = x => (x.workout_type==='瑜伽'&&x.duration_min===45)||(x.workout_type==='羽毛球'&&x.duration_min===60)||(x.workout_type==='力量训练'&&x.duration_min===75);
  const bills    = S.bills.filter(x => { const hit = fpBill.has(x.description); if (hit) ids.push(x.id); return !hit; });
  const diet     = S.diet.filter(x => { const hit = fpDiet.has(x.food_name); if (hit) ids.push(x.id); return !hit; });
  const workouts = S.workouts.filter(x => { const hit = woDemo(x); if (hit) ids.push(x.id); return !hit; });
  const gz       = S.gz.filter(x => { const hit = fpGz.has(x.title); if (hit) ids.push(x.id); return !hit; });
  let n = ids.length;
  S_ARCH.workouts = (S_ARCH.workouts||[]).filter(x => { if (woDemo(x)) { ids.push(x.id); n++; return false; } return true; });
  update({ ...S, bills, diet, workouts, gz, _deleted:[...new Set([...(S._deleted||[]), ...ids])].slice(-1000) });
  render();
  toast(n ? `已清除 ${n} 条演示假数据 🧹` : '没有发现演示假数据，很干净 🍊');
}

/* ---------- 路由与渲染 ---------- */
let currentPath = '/';
function buildNav(){
  let last = null;
  const html = NAV.map((n, i) => {
    let head = '';
    if (n.group && n.group !== last) { head = `<div class="nav-group-title">${esc(n.group)}</div>`; last = n.group; }
    return head + `<a class="nav-item ${n.path===currentPath?'active':''}" style="--i:${i}" href="#${n.path}" data-path="${n.path}">
      <span class="nav-ico"><span class="em">${kico(n.icon, 30)}</span>${n.badge?`<i class="nav-badge">${n.badge}</i>`:''}</span>
      <span class="nav-label">${esc(n.label)}</span>
      ${n.path==='/reminders' ? '<span class="chip pink" style="margin-left:auto;font-size:10px;padding:1px 7px;display:none" id="navRemBadge"></span>' : ''}
    </a>`;
  }).join('');
  document.getElementById('nav').innerHTML = html;
}
function updateRemBadge(){
  const wd = new Date().getDay();
  const n = dt('reminders').filter(r => {
    if (!r.enabled) return false;
    if (r.repeat==='weekday') return wd>=1&&wd<=5;
    if (r.repeat==='weekly') return (r.weekdays||[]).includes(wd);
    return true;
  }).length;
  const b = document.getElementById('navRemBadge');
  if (b) { b.style.display = n ? '' : 'none'; b.textContent = n; }
}
function render(){
  const main = document.getElementById('main');
  /* 阅读器/书籍详情路由：任何 update 触发的重渲染都必须留在当前书页，不能踢回列表 */
  const rh = location.hash.slice(1) || '';
  const readM = rh.match(/^\/read\/([^?]+)(?:\?ch=(\d+))?/);
  const bookM = rh.match(/^\/book\/([^?]+)/);
  if (readM || bookM) {
    currentPath = '/reading';
    const sy = window.scrollY;
    const samePage = readM ? (rh === lastReaderHash) : false;
    main.innerHTML = `<section class="page active">${readM ? PAGES.__read(readM[1], +(readM[2]||0)) : PAGES.__book(bookM[1])}</section>`;
    if (readM) bindReadBar();
    document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.path === '/reading'));
    updateRemBadge(); updateSyncPill();
    window.scrollTo(0, samePage ? sy : 0);
    lastReaderHash = rh;
    return;
  }
  const fn = PAGES[currentPath] || PAGES['/'];
  main.innerHTML = `<section class="page active">${fn()}</section>`;
  const bm = document.getElementById('btnDrawerMenu');
  if (bm) bm.innerHTML = kico('menu',15) + ' 菜单';
  document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.path === currentPath));
  updateRemBadge(); updateSyncPill();
  window.scrollTo(0,0);
}
function route(){
  const h = location.hash.slice(1) || '/';
  if (/^\/(read|book)\//.test(h)) { render(); return; }   /* 阅读器由 render 统一处理 */
  currentPath = h;
  if (!PAGES[currentPath]) currentPath = '/';
  render();
}
window.addEventListener('hashchange', () => {
  if (window.innerWidth <= 860) document.getElementById('sidebar').style.display = 'none';
  route();
});
onStore(render);
if (window.Notification) {
  const setBtn = () => { const b = document.getElementById('btnNotif'); if (b) b.innerHTML = Notification.permission==='granted' ? kico('check',14)+' 通知已开启' : Notification.permission==='denied' ? kico('hot',14)+' 通知被拒绝' : kico('bell',14)+' 通知权限'; };
  new MutationObserver(setBtn).observe(document.getElementById('main'), { childList:true });
}
function askNotif(){
  if (!window.Notification) { toast('当前浏览器不支持通知'); return; }
  Notification.requestPermission().then(p => {
    toast(p==='granted' ? '通知已开启，到点会弹出提醒 🍊' : p==='denied' ? '通知权限被拒绝，可在浏览器设置中恢复' : '稍后再说');
    render();
  });
}

/* ---------- 启动 ---------- */
(() => { const ba = document.getElementById('brandAvatar'); if (ba) ba.src = KITTY_AVATAR; })();
buildNav();
loadStore();
route();
checkReminders();
setInterval(() => checkReminders(false), 15000);
setInterval(() => { runDueJobs(); ensureBoards(false, true); ensureDailyNews(false, true); runDueAI(); }, 60000);   // 每分钟检查抓取/AI 计划与新的一天
if (window.innerWidth > 860) document.getElementById('sidebar').style.display = 'flex';



</script>
</body>

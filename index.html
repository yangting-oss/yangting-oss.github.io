<style>
  :root{
    /* Dimoo 紫曜星夜：主紫 #C8B6F2 → #9E86E8 / 文字 #5A4480 / 高亮 #8062C2 */
    --primary:#8E74D6; --primary-strong:#7A5FC9; --primary-deep:#5A4480;
    --primary-50:#F7F4FF; --primary-100:#EFEAFF; --primary-200:#E2D9FF; --primary-300:#D3C6FA; --primary-400:#C8B6F2;
    --orange-50:#F8F5FF; --orange-300:#DCCDF9; --orange:#8E74D6; --peach:#C8B6F2;
    --bg:#F8F5FF; --text:#5A4480; --muted:#9C8FBF; --border:#E7DEFF;
    --ok:#2E9E7A; --amber:#8E74D6; --danger:#C85F94;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(rgba(155,124,231,.16) 2px, transparent 2.6px),
      radial-gradient(rgba(200,182,242,.18) 1.2px, transparent 1.8px),
      radial-gradient(circle at 82% 8%, rgba(255,249,217,.30), transparent 42%),
      radial-gradient(circle at 12% 92%, rgba(242,217,247,.45), transparent 46%),
      linear-gradient(160deg,#FBF9FF 0%,#F8F5FF 45%,#F3EDFF 100%);
    background-size:38px 38px,26px 26px,auto,auto,auto;
    background-position:0 0,13px 19px,0 0,0 0,0 0;
    background-attachment:fixed;
    color:var(--text); font-size:14px; line-height:1.6; min-height:100vh;
  }
  ::selection{background:var(--primary-200)}

  /* ============ 侧边栏 ============ */
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:260px;z-index:50;
    background:linear-gradient(180deg,rgba(236,228,255,.92),rgba(248,245,255,.70) 50%,rgba(238,232,255,.86));
    border-right:2px dashed var(--primary-200); backdrop-filter:blur(10px);
    display:flex;flex-direction:column;padding:20px 14px 14px;
  }
  .brand{display:flex;flex-direction:column;align-items:center;padding:4px 0 14px;gap:2px}
  .brand .brand-avatar{width:68px;height:68px;border-radius:24px;object-fit:cover;box-shadow:0 4px 14px rgba(122,94,200,.32);border:2.5px solid #fff;background:linear-gradient(135deg,#E6DEFF,#DCCDF9)}
  .brand b{font-size:18px;letter-spacing:1px;color:var(--primary-deep)}
  .brand span{font-size:11px;color:#9A8CC0;letter-spacing:.5px}
  .nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding-right:2px}
  .nav::-webkit-scrollbar{width:4px}
  .nav::-webkit-scrollbar-thumb{background:var(--primary-200);border-radius:4px}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;text-decoration:none;
    color:var(--muted);font-size:13.5px;font-weight:500;border:none;background:none;text-align:left;
    font-family:inherit;transition:all .15s;text-decoration:none;
  }
  .nav-item .em{font-size:16px;width:22px;text-align:center;flex:none}
  .nav-item:hover{background:rgba(255,255,255,.85);color:var(--text);border-left:3px solid var(--orange-300)}
  .nav-item.active{background:linear-gradient(135deg,#fff,#EFEAFF);color:var(--primary-deep);font-weight:600;box-shadow:0 2px 10px rgba(126,98,214,.22);border-left:3px solid var(--primary)}
  .nav-item.active .em{transform:scale(1.15) rotate(-3deg)}
  .ver{text-align:center;color:#9A8CC0;font-size:11px;padding-top:10px}

  /* ============ 主区域 ============ */
  .main{margin-left:260px;padding:26px 30px 90px;max-width:1120px}
  .page{display:none}
  .page.active{display:block;animation:fadein .25s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .page-head{margin-bottom:18px}
  .page-head h1{font-size:21px;font-weight:700;display:flex;align-items:center;gap:8px}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

  .card{
    background:rgba(255,255,255,.9);border:2px solid var(--primary-100);border-radius:20px;
    backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(126,98,214,.08);
  }
  .card-pad{padding:16px 18px}
  .sec-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .muted{color:var(--muted)}
  .small{font-size:12px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 15px;border-radius:99px;
    border:2px solid var(--primary-200);background:#fff;color:var(--text);cursor:pointer;font-size:13px;
    font-family:inherit;font-weight:600;transition:all .15s;text-decoration:none;
  }
  .btn:hover{border-color:var(--primary);color:var(--primary-deep);transform:translateY(-1px)}
  .btn.primary{
    background:linear-gradient(135deg,#C8B6F2,var(--primary));border:none;color:#fff;
    box-shadow:0 4px 12px rgba(126,98,214,.38);
  }
  .btn.primary:hover{color:#fff;filter:brightness(1.05)}
  .btn.sm{padding:5px 11px;font-size:12px}
  .btn.danger{color:var(--danger)}
  .btn.danger:hover{border-color:var(--danger)}

  input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{
    width:100%;padding:8px 12px;border-radius:14px;border:2px solid var(--primary-100);
    background:#fff;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:all .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(126,98,214,.17)}
  textarea{resize:vertical;min-height:100px;line-height:1.7}

  .chip{
    display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;
    background:var(--primary-100);color:var(--primary-deep);font-size:11px;font-weight:600;
  }
  .chip.pink{background:#E8DFFF;color:#5A4480}
  .chip.green{background:#d3f9ee;color:#087f5b}
  .chip.amber{background:#F0EAFF;color:#e67700}
  .chip.gray{background:#F8F5FF;color:var(--muted)}
  .chip.blue{background:#e7f5ff;color:#1971c2}

  .switch{position:relative;width:38px;height:22px;flex:none;display:inline-block}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--primary-200);border-radius:99px;cursor:pointer;transition:.2s}
  .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked + .slider{background:var(--primary)}
  .switch input:checked + .slider:before{transform:translateX(16px)}

  /* 概览卡片 */
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:14px}
  @media (max-width:759px){.ov-grid{grid-template-columns:repeat(2,1fr)}}
  .ov-grid-3{grid-template-columns:repeat(3,1fr)}
  @media (max-width:520px){
    .ov-grid-3{gap:8px}
    .ov-grid-3 .ov-card{padding:12px 10px;gap:8px}
    .ov-grid-3 .ov-ico{width:30px;height:30px;border-radius:11px}
    .ov-grid-3 .ov-ico .kico{width:22px;height:22px}
    .ov-grid-3 .ov-card .lbl{font-size:10.5px}
    .ov-grid-3 .ov-card .val{font-size:16px}
  }
  .ov-card{display:flex;align-items:center;gap:13px;padding:16px 17px}
  .ov-ico{width:44px;height:44px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
  .ov-card .lbl{font-size:12px;color:var(--muted)}
  .ov-card .val{font-size:21px;font-weight:700;line-height:1.2}
  .ov-card .val small{font-size:12px;font-weight:500;color:var(--muted)}
  .ov-link{text-decoration:none;color:inherit;transition:transform .15s,box-shadow .2s}
  .ov-link:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(126,98,214,.18)}
  .ov-link:active{transform:scale(.98)}
  .home-tap{cursor:pointer;border-radius:10px;transition:background .15s}
  .home-tap:hover{background:var(--primary-50)}
  .home-tap:active{background:var(--primary-100)}
  /* 喝水打卡卡片 */
  .ov-water{position:relative;padding-right:13px}
  .ov-water .ov-ico{position:relative}
  .ov-water .drop{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;
    background:#fff;border:1.5px solid var(--primary-100);display:flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;box-shadow:0 2px 6px rgba(118,94,176,.18)}
  .ov-water .water-body{flex:1;min-width:0}
  .water-seg{display:flex;gap:3px;margin-top:5px}
  .water-seg i{flex:1;height:5px;border-radius:99px;background:var(--primary-100);transition:background .25s}
  .water-seg i.on{background:linear-gradient(90deg,#D3C6FA,var(--primary))}
  .water-add{border:none;cursor:pointer;font-family:inherit;flex:none;width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,#DCCDF9,var(--primary));color:#fff;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(120,100,180,.26);
    transition:transform .15s,box-shadow .15s}
  .water-add:hover{transform:translateY(-1px) scale(1.06)}
  .water-add.done{background:linear-gradient(135deg,#C9E6CF,#8FB79A)}
  @media (max-width:480px){
    .ov-water{gap:8px;padding:13px 11px}
    .ov-water .ov-ico .kico{width:38px;height:38px}
    .ov-water .drop{width:15px;height:15px;font-size:8px;right:-3px;bottom:-3px;border-width:1px}
    .ov-water .lbl{font-size:11px;white-space:nowrap}
    .ov-water .val{font-size:17px}
    .ov-water .val small{font-size:10.5px;white-space:nowrap}
    .water-add{width:26px;height:26px;font-size:12px}
    .water-seg{gap:2px;margin-top:4px}
  }

  .g-green{background:linear-gradient(135deg,#63e6be,#0ca678)}
  .g-amber{background:linear-gradient(135deg,#D8C6F8,#8E74D6)}
  .g-rose{background:linear-gradient(135deg,#C8B6F2,#C85F94)}
  .g-sky{background:linear-gradient(135deg,#74c0fc,#1c7ed6)}
  .g-yellow{background:linear-gradient(135deg,#E7DBFF,#f59f00)}
  .g-violet{background:linear-gradient(135deg,#C8B6F2,#be4bdb)}

  .progress{height:10px;border-radius:99px;background:var(--primary-100);overflow:hidden}
  .progress > div{height:100%;border-radius:99px;background:linear-gradient(90deg,#C8B6F2,var(--primary));transition:width .4s}

  /* 快速入口 */
  .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:900px){.quick-grid{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:600px){.quick-grid{grid-template-columns:repeat(2,1fr)}}
  .quick-item{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 13px;cursor:pointer;
    transition:all .18s;text-decoration:none;color:var(--text);
  }
  .quick-item .em{font-size:26px;line-height:1;transition:transform .18s}
  .quick-item span.t{font-size:12.5px;font-weight:600;color:var(--text)}
  .quick-item:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(126,98,214,.22);border-color:var(--primary-300)}
  .quick-item:hover .em{transform:scale(1.18) rotate(-6deg)}

  /* 列表行 */
  .row{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px dashed var(--primary-200)}
  .row:last-child{border-bottom:none}
  .row.done .t{ text-decoration:line-through;color:var(--muted) }
  .icon-btn{border:none;background:none;color:#9A8CC0;cursor:pointer;font-size:14px;padding:4px 6px;border-radius:8px;line-height:1}
  .icon-btn:hover{color:var(--danger);background:var(--primary-50)}

  /* 选项卡 */
  .tabs{display:inline-flex;background:#fff;border:2px solid var(--primary-100);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
  .tab{border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);
    padding:6px 13px;border-radius:99px;cursor:pointer;transition:all .15s}
  .tab.active{background:linear-gradient(135deg,#C8B6F2,var(--primary));color:#fff;box-shadow:0 2px 8px rgba(126,98,214,.32)}

  /* 公众号阅读清单（移动端优先单列卡片） */
  .gz-list{display:flex;flex-direction:column;gap:10px}
  .gz-card{background:rgba(255,255,255,.92);border:2px solid var(--primary-100);border-radius:16px;padding:12px 14px;cursor:pointer;transition:all .15s}
  .gz-card:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(126,98,214,.12)}
  .gz-card.open{border-color:var(--primary-300);border-style:solid;background:linear-gradient(135deg,#fff,#FAF8FF)}
  .gz-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .gz-title{font-weight:700;font-size:15px;line-height:1.55;margin:7px 0 3px;color:var(--text);word-break:break-word}
  .gz-card.open .gz-title{color:var(--primary-deep)}
  .gz-meta{font-size:12px;color:var(--muted)}
  .gz-hint{font-size:11px;color:#9A8CC0;margin-top:6px}
  .gz-detail{margin-top:10px;border-top:2px dashed var(--primary-100);padding-top:10px}
  .gz-note{font-size:13px;line-height:1.7;background:var(--primary-50);border-radius:10px;padding:8px 11px;margin-bottom:9px}
  .gz-acts{display:flex;gap:8px;flex-wrap:wrap}
  @media (max-width:720px){
    .gz-card{padding:11px 12px}
    .gz-title{font-size:14.5px;line-height:1.6}
    .tabs{width:100%}
  }

  /* 打卡 / 餐次卡片 */
  .meal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (max-width:700px){.meal-grid{grid-template-columns:1fr}}
  .meal-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .meal-em{width:38px;height:38px;border-radius:14px;background:var(--primary-50);border:2px solid var(--primary-100);display:flex;align-items:center;justify-content:center;font-size:17px}

  /* 14 天打卡 */
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;background:var(--primary-50);font-size:11px;color:var(--muted)}
  .day.hit{background:linear-gradient(135deg,#E3D7FB,#E8DFFF);color:var(--primary-deep);font-weight:700}
  .day .ck{font-size:10px;color:var(--ok)}

  /* 热点排名 */
  .rank{width:30px;height:30px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:800;color:#fff}
  .r1{background:linear-gradient(135deg,#8E74D6,#C8B6F2)}
  .r2{background:linear-gradient(135deg,#C8B6F2,#F2D9F7)}
  .r3{background:linear-gradient(135deg,#D8C6F8,#E7DBFF)}
  .rx{background:linear-gradient(135deg,#C8B6F2,#F2D9F7)}

  /* 记账条形 */
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
  .bar-row:last-child{margin-bottom:0}
  .bar-track{flex:1;height:8px;border-radius:99px;background:var(--primary-50);overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#C8B6F2,var(--primary))}

  /* 占位页 */
  .wip{display:flex;flex-direction:column;align-items:center;gap:8px;padding:46px 20px;text-align:center}
  .wip .em{font-size:40px}
  .wip b{font-size:16px}
  .wip p{color:var(--muted);font-size:13px;max-width:340px}

  /* ============ Dimoo 星夜横幅 ============ */
  .hero{
    position:relative;border-radius:26px;padding:22px 24px;margin-bottom:18px;overflow:hidden;
    background:linear-gradient(135deg,#B9A4F2 0%,#9E86E8 42%,#C0AEF4 100%);
    border:2px solid rgba(255,255,255,.85);box-shadow:0 10px 30px rgba(120,92,200,.30);
  }
  .hero:before{
    content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
    background:radial-gradient(rgba(255,255,255,.9) 2.5px, transparent 3px);
    background-size:26px 26px;
  }
  .hero-row{position:relative;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .hero .hero-avatar{width:118px;height:118px;flex:none;border-radius:36px;object-fit:cover;border:3px solid #fff;box-shadow:0 6px 18px rgba(122,94,200,.30);filter:saturate(1.05)}
  .hero-date{font-size:13px;font-weight:700;color:#F1EAFF;letter-spacing:1px}
  .hero-quote{font-size:18px;font-weight:800;color:#fff;margin:4px 0 6px;line-height:1.5;text-shadow:0 1px 7px rgba(90,68,128,.35)}
  .hero-sub{font-size:12.5px;color:#ECE4FF}
  .hero-bow{position:absolute;right:-8px;bottom:-18px;font-size:96px;opacity:.42;transform:rotate(-12deg);pointer-events:none}
  .float-heart{position:absolute;font-size:14px;opacity:.5;animation:floaty 5s ease-in-out infinite;pointer-events:none}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* ============ 可爱动效增强 Kawaii Motion ============ */
  @media (prefers-reduced-motion: reduce){
    *,*:before,*:after{animation:none !important;transition:none !important}
  }

  /* 横幅 Dimoo 头像：弹跳入场 + 慢慢摇摆 */
  .hero .hero-avatar{animation:kitty-in .7s cubic-bezier(.34,1.56,.64,1) both, kitty-sway 4.6s ease-in-out 1.1s infinite}
  .brand .brand-avatar{animation:kitty-in .6s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes kitty-in{from{opacity:0;transform:scale(.45) translateY(22px)}to{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes kitty-sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

  /* 成套 Dimoo 贴纸图标（透明贴纸风 + 软阴影） */
  .kico{flex:none;display:inline-block;vertical-align:middle;object-fit:contain;background:transparent;border:none;
        filter:drop-shadow(0 3px 6px rgba(122,94,200,.24));animation:lulu-in .5s cubic-bezier(.34,1.56,.64,1) both}
  .nav-item .kico{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .nav-item:hover .kico{transform:scale(1.16) rotate(-6deg)}
  .nav-item.active .kico{transform:scale(1.12);animation:lulu-bob 3.2s ease-in-out infinite}
  .quick-item .kico{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .quick-item:hover .kico{transform:scale(1.18) rotate(7deg)}
  .page-head h1 .kico{margin-right:3px}
  .sec-title .kico{filter:drop-shadow(0 2px 4px rgba(122,94,200,.20))}
  .ov-ico{background:none !important;width:auto;height:auto}
  .ov-ico .kico{width:54px;height:54px;animation:lulu-bob 3.6s ease-in-out infinite}
  .feed-ico{background:none;padding:0}
  .feed-ico .kico{width:46px;height:46px}
  .chip .kico{width:15px;height:15px;filter:none;animation:none}
  .tab .kico{width:15px;height:15px;filter:none;animation:none;margin-right:2px;vertical-align:-3px}
  .btn .kico{width:15px;height:15px;filter:none;animation:none;margin-right:2px;vertical-align:-3px}
  .meal-em{background:none !important;border:none;padding:0}
  .meal-em .kico{width:40px;height:40px}
  .hero-date .kico{width:14px;height:14px;filter:none;animation:none;vertical-align:-2px}

  /* Dimoo 动效 */
  @keyframes lulu-in{0%{opacity:0;transform:scale(.55) translateY(14px)}100%{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes lulu-bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
  @keyframes lulu-wave{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  /* ============ Dimoo 工作台 · 全套主题强化 ============ */
  /* 侧边栏分组标题 */
  .nav-group-title{font-size:11px;font-weight:800;color:#7E62CE;letter-spacing:2.5px;
    padding:14px 8px 6px;display:flex;align-items:center;gap:7px}
  .nav-group-title:before{content:"";width:7px;height:7px;border-radius:50%;
    background:linear-gradient(135deg,#DCCDF9,#8E74D6);box-shadow:0 0 0 4px rgba(216,196,247,.28)}
  /* 侧边栏导航项：Dimoo 贴纸 + 右下角功能徽章 */
  .nav-item{padding:6px 12px;border-radius:16px;gap:11px;border-left:none}
  .nav-item .nav-ico{position:relative;flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
  .nav-item .nav-ico .kico{width:32px;height:32px;filter:drop-shadow(0 3px 5px rgba(122,94,200,.26))}
  .nav-badge{position:absolute;right:-3px;bottom:-4px;width:17px;height:17px;border-radius:50%;
    background:#fff;border:1.5px solid var(--primary-200);display:flex;align-items:center;justify-content:center;
    font-size:9px;line-height:1;font-style:normal;box-shadow:0 2px 6px rgba(122,94,200,.28)}
  .nav-item .nav-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-item:hover{border-left:none;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(126,98,214,.14)}
  .nav-item.active{border-left:none;background:linear-gradient(135deg,#A78BEA,#7E62CE);color:#fff;
    box-shadow:0 8px 20px rgba(120,92,200,.34)}
  .nav-item.active .nav-badge{border-color:#fff}

  /* 贴纸动效 */
  @keyframes sticker-float{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-6px) rotate(2.5deg)}}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7) rotate(0)}50%{opacity:.9;transform:scale(1.12) rotate(18deg)}}

  /* 卡片：更大圆角 + 软阴影 */
  .card{border-radius:24px;box-shadow:0 6px 20px rgba(126,98,214,.10)}

  /* hero 贴纸（左：Dimoo 大形象；右：月亮贴纸） */
  .hero-mascot{flex:none;width:112px;height:146px;display:flex;align-items:center;justify-content:center}
  .hero-img{width:112px;height:146px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(90,68,128,.30));
    animation:kitty-in .7s cubic-bezier(.34,1.56,.64,1) both, sticker-float 4.4s ease-in-out 1s infinite}
  .hero-mascot .kico{width:104px;height:104px;filter:drop-shadow(0 10px 18px rgba(122,94,200,.32));
    animation:kitty-in .7s cubic-bezier(.34,1.56,.64,1) both, sticker-float 4.4s ease-in-out 1s infinite}
  .hero-sticker{flex:none;width:92px;height:92px;border-radius:26px;border:2px dashed var(--primary-200);
    background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(122,94,200,.16)}
  .hero-sticker .kico{width:70px;height:70px;animation:sticker-float 4.6s ease-in-out infinite}

  /* 快捷入口：大号 Dimoo 贴纸 */
  .quick-item{padding:18px 8px 14px;overflow:hidden}
  .quick-item .em{line-height:0}
  .quick-item .em .kico{width:52px;height:52px;filter:drop-shadow(0 5px 10px rgba(122,94,200,.26))}
  .quick-item:after{content:"✨";position:absolute;top:8px;right:11px;font-size:12px;opacity:.75;
    animation:twinkle 3.6s ease-in-out infinite;pointer-events:none}

  /* 工作计划 & 养生知识 */
  .day-strip{display:flex;gap:7px;margin-top:4px}
  .day-pill{flex:1;min-width:54px;text-align:center;padding:8px 4px 6px;border-radius:14px;border:2px dashed var(--primary-100);cursor:pointer;background:#fff;transition:all .15s}
  .day-pill:hover{transform:translateY(-2px);box-shadow:0 3px 9px rgba(126,98,214,.14)}
  .day-pill.active{border-color:var(--primary-300);border-style:solid;background:linear-gradient(135deg,#fff,#EFEAFF);box-shadow:0 2px 8px rgba(126,98,214,.18)}
  .day-pill.today{border-color:var(--primary-300);border-style:solid}
  .day-pill .d{font-size:10.5px;color:var(--muted)}
  .day-pill .n{font-weight:700;font-size:13px;color:var(--text)}
  .day-pill .bar{height:5px;border-radius:4px;background:var(--primary-100);margin-top:5px;overflow:hidden}
  .day-pill .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#DCCDF9);transition:width .3s}
  .habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
  .habit{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;border:2px dashed var(--primary-100);background:#fff;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;user-select:none}
  .habit .em{font-size:17px}
  .habit .hk{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--primary-200);background:#fff;flex:none;transition:all .15s;display:flex;align-items:center;justify-content:center}
  .habit:hover{transform:translateY(-2px);box-shadow:0 3px 9px rgba(126,98,214,.14)}
  .habit.on{border-color:var(--primary-300);border-style:solid;background:linear-gradient(135deg,#F8F5FF,#EFEAFF)}
  .habit.on .hk{background:var(--primary);border-color:var(--primary)}
  .habit.on .hk::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
  .tip-quote{font-size:16px;font-weight:700;color:var(--primary-deep);line-height:1.75}
  @media (max-width:720px){ .day-pill{min-width:44px} .habit-grid{grid-template-columns:repeat(2,1fr)} }

  /* 横幅星星散点闪烁 */
  .hero-star{
    position:absolute;pointer-events:none;font-weight:700;line-height:1;
    color:#fff;text-shadow:0 0 8px rgba(255,255,255,.95);
    animation:twinkle 3.2s ease-in-out infinite;
  }
  .hero-star.gold{color:#B7A0F0;text-shadow:0 0 10px rgba(183,160,240,.9)}
  .hero-star.rose{color:#C8B6F2;text-shadow:0 0 10px rgba(200,182,242,.95)}
  .hero-star.orange{color:#C8B6F2;text-shadow:0 0 10px rgba(200,182,242,.95)}
  @keyframes twinkle{
    0%,100%{opacity:.12;transform:scale(.55) rotate(0deg)}
    50%{opacity:.95;transform:scale(1.18) rotate(26deg)}
  }

  /* 大蝴蝶结丝带飘动 */
  .hero-bow{animation:bow-sway 5.2s ease-in-out infinite}
  .hero-mascot-deco{
      position:absolute;left:-12px;bottom:-26px;font-size:110px;opacity:.16;pointer-events:none;
      animation:mascot-bob 6s ease-in-out infinite;filter:drop-shadow(0 4px 12px rgba(122,94,200,.25));
    }
    @keyframes mascot-bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  @keyframes bow-sway{
    0%,100%{transform:rotate(-12deg) translateY(0)}
    50%{transform:rotate(-6deg) translateY(-7px)}
  }

  /* 爱心心跳（与 floaty 叠加：scale 独立于 transform） */
  .float-heart{animation:floaty 5s ease-in-out infinite, heart-pulse 2.4s ease-in-out infinite}
  @keyframes heart-pulse{0%,100%{scale:1}50%{scale:1.28}}

  /* 页面内容依次浮入（stagger） */
  .page.active > *{animation:rise-in .5s cubic-bezier(.25,.7,.35,1) backwards}
  .page.active > *:nth-child(1){animation-delay:.02s}
  .page.active > *:nth-child(2){animation-delay:.09s}
  .page.active > *:nth-child(3){animation-delay:.16s}
  .page.active > *:nth-child(4){animation-delay:.23s}
  .page.active > *:nth-child(5){animation-delay:.3s}
  .page.active > *:nth-child(6){animation-delay:.37s}
  .page.active > *:nth-child(7){animation-delay:.44s}
  .page.active > *:nth-child(n+8){animation-delay:.5s}
  @keyframes rise-in{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

  /* 卡片悬浮反馈 */
  .card{transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 7px 22px rgba(126,98,214,.16);border-color:var(--primary-200)}

  /* 按钮点击回弹 + 换一句骰子旋转 */
  .btn:active{transform:scale(.92) !important}
  .dice{display:inline-block;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
  .btn:hover .dice{transform:rotate(180deg) scale(1.12)}

  /* 进度条流光 */
  .progress > div{position:relative;overflow:hidden}
  .progress > div:after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.6) 50%,transparent 75%);
    background-size:220% 100%;animation:shimmer 2.4s linear infinite;
  }
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

  /* 时间胶囊铃铛摇摆 */
  .rem-time-pill{transition:transform .2s;cursor:default}
  .rem-time-pill:hover{animation:bell-swing .65s ease}
  @keyframes bell-swing{
    0%,100%{transform:rotate(0)}
    22%{transform:rotate(9deg)}
    52%{transform:rotate(-8deg)}
    78%{transform:rotate(4deg)}
  }

  /* 导航图标弹跳 */
  .nav-item:hover .em{animation:em-bounce .5s ease}
  @keyframes em-bounce{0%,100%{transform:translateY(0)}38%{transform:translateY(-4px)}68%{transform:translateY(-1px)}}

  /* 全局漂浮装饰（内容层之下） */
  .bg-deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .bg-deco span{position:absolute;font-size:19px;opacity:.3;animation:drift 11s ease-in-out infinite}
  .bg-deco span:nth-child(2n){animation-duration:14s;animation-delay:2.4s}
  .bg-deco span:nth-child(3n){font-size:14px;animation-duration:17s;animation-delay:4.6s}
  .bg-deco span:nth-child(5n){animation-duration:20s;animation-delay:6.2s}
  @keyframes drift{
    0%,100%{transform:translate(0,0) rotate(-8deg)}
    50%{transform:translate(8px,-18px) rotate(10deg)}
  }

  /* 每日一句话切换动效 */
  .hero-quote.quote-swap{animation:quote-in .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes quote-in{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}

  /* 提醒时间线 */
  .rem-line{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
  .rem-time-pill{flex:none;font-weight:800;color:var(--primary-deep);background:var(--primary-100);border-radius:12px;padding:3px 10px;font-size:13px}
  .rem-next{background:linear-gradient(135deg,#F8F5FF,#fff);border-radius:14px;outline:2px solid var(--primary-200)}

  /* ============ 读书 ============ */
  .book-card{position:relative;display:flex;gap:14px;padding:15px;align-items:flex-start}
  .book-cover{
    width:72px;height:96px;border-radius:8px 14px 14px 8px;flex:none;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#fff;font-size:30px;position:relative;
    box-shadow:2px 3px 0 rgba(126,98,214,.28);cursor:pointer;transition:transform .18s;
  }
  .book-cover:hover{transform:scale(1.05) rotate(-2deg)}
  .book-cover:after{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
  .book-cover .bname{font-size:10.5px;font-weight:700;writing-mode:vertical-rl;letter-spacing:2px;margin-top:4px;max-height:60px;overflow:hidden}
  .book-meta{flex:1;min-width:0}
  .book-meta b.t{font-size:15.5px}
  .book-meta .au{font-size:12px;color:var(--muted);margin-bottom:4px}
  .c-hot-pink{background:linear-gradient(135deg,#C8B6F2,#C85F94)}
  .c-mint{background:linear-gradient(135deg,#8ce8cc,#0ca678)}
  .c-sky{background:linear-gradient(135deg,#91caff,#1c7ed6)}
  .c-lav{background:linear-gradient(135deg,#d0bfff,#9c36b5)}
  .c-sun{background:linear-gradient(135deg,#E7DBFF,#8E74D6)}
  .c-coral{background:linear-gradient(135deg,#ffa8a8,#e03131)}
  .c-cocoa{background:linear-gradient(135deg,#d9b08c,#8d5524)}
  .c-gray{background:linear-gradient(135deg,#dee2e6,#495057)}
  .c-peach{background:linear-gradient(135deg,#E3D7FB,#8E74D6)}
  /* 阅读器 */
  .reader-body{font-size:16px;line-height:2.1;color:#4a2c3b;white-space:pre-wrap}
  .reader-toolbar{position:sticky;top:0;z-index:5;background:rgba(255,247,251,.95);backdrop-filter:blur(8px);border-bottom:2px dashed var(--primary-200);padding:10px 14px;border-radius:18px 18px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .font-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--primary-200);background:#fff;font-weight:800;color:var(--primary-deep);cursor:pointer}
  .quote-card{background:linear-gradient(135deg,#F7F4FF,#fff);border-left:4px solid var(--primary-300);border-radius:0 16px 16px 0;padding:12px 14px;font-style:italic;color:#7c4a63}
  /* 读书小馆 · 今日书单 */
  .read-hero{padding:18px 20px}
  .read-hero .rh-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
  .read-hero .rh-head>div{flex:1;min-width:0}
  .daily-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
  .daily-item{display:flex;align-items:center;gap:10px;min-width:0;padding:9px 11px;border-radius:15px;
    text-decoration:none;color:var(--text);background:rgba(255,255,255,.9);
    border:1.5px solid rgba(255,255,255,.95);transition:transform .16s,box-shadow .16s}
  .daily-item:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(126,98,214,.18)}
  .daily-item .dm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .daily-item .dm b{font-size:13.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .daily-item .dm span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .daily-item .dgo{flex:none;font-size:10.5px;font-weight:700;color:var(--primary-deep);
    background:var(--primary-50);border-radius:99px;padding:4px 8px;display:none}
  @media (min-width:641px){.daily-item .dgo{display:inline-block}}
  @media (max-width:640px){.daily-list{grid-template-columns:1fr}}
  /* 读书小馆 · 上次读到 */
  .reading-now{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px;
    border-radius:20px;border:2px solid var(--primary-200);background:linear-gradient(135deg,#fff,#F8F5FF)}
  .reading-now .rn-body{flex:1;min-width:170px}
  .reading-now .rn-top{display:flex;align-items:center;gap:7px;min-width:0}
  .reading-now .rn-top b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reading-now .rn-sub{font-size:11.5px;color:var(--muted);margin:3px 0 6px}
  .reading-now .progress{height:6px}
  .reading-now .rn-btn{flex:none}
  @media (max-width:560px){.reading-now .rn-btn{width:100%}}
  /* 读书小馆 · 工具条 */
  .read-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .read-tools .tabs{flex:1 1 auto;min-width:0}
  .read-tools select{width:118px;flex:none}
  @media (max-width:600px){
    .read-tools{gap:8px}
    .read-tools .tabs{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .read-tools .tabs::-webkit-scrollbar{display:none}
    .read-tools .tabs .tab{flex:none}
    .read-tools select{width:100%;height:38px}
    .book-card{padding:13px;gap:11px}
    .book-card .book-cover{width:58px;height:78px;font-size:24px}
    .book-card .book-cover .bname{display:none}
    .book-meta b.t{font-size:14.5px}
  }

  /* ============ 自动化/抓取任务 ============ */
  .feed-ico{width:42px;height:42px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--primary-100)}
  .point-li{display:flex;gap:7px;margin-top:5px;font-size:12.5px;line-height:1.65}
  .point-li .b{color:var(--primary);font-weight:800}

  /* 底部状态 */
  .sync-pill{
    position:fixed;right:18px;bottom:16px;z-index:60;display:flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.92);border:2px solid var(--primary-100);border-radius:99px;
    padding:7px 14px;font-size:11.5px;color:var(--muted);box-shadow:0 4px 14px rgba(126,98,214,.12);backdrop-filter:blur(8px);
  }
  .sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
  .sync-pill.off .dot{background:var(--amber);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* 移动端 */
  .mobile-top{display:none}
  @media (max-width:860px){
    .sidebar{display:none}
    .main{margin-left:0;padding:70px 14px 116px}
    .mobile-top{
      display:flex;position:fixed;top:0;left:0;right:0;z-index:70;align-items:center;gap:10px;
      background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:2px dashed var(--primary-200);
      padding:12px 16px;
    }
    .mobile-top b{font-size:15px;color:var(--primary-deep)}
    .mobile-top .spacer{flex:1}
  }

  /* 弹窗 / Toast */
  .mask{position:fixed;inset:0;background:rgba(126,98,214,.30);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;backdrop-filter:blur(3px)}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:24px;box-shadow:0 24px 60px rgba(126,98,214,.32);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px 24px;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{font-size:16px;margin-bottom:15px;color:var(--primary-deep)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1}
  .modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
  #toastBox{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
  .toast{background:#8E74D6;color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;box-shadow:0 8px 24px rgba(126,98,214,.42);animation:pop .2s ease;max-width:92vw}

  /* ============ v5 · 去白边融入主题 + 动效增强 ============ */
  /* 图标：不要白底、不要描边，只用暖色软投影贴合主题 */
  .kico{background:none!important;border:none!important;border-radius:0;
        filter:drop-shadow(0 4px 7px rgba(118,90,196,.30)) drop-shadow(0 1px 2px rgba(118,90,196,.16));
        transition:scale .2s cubic-bezier(.34,1.56,.64,1),rotate .2s cubic-bezier(.34,1.56,.64,1);
        animation:lulu-pop .55s cubic-bezier(.34,1.56,.64,1) both}
  .page-head h1 .kico,.sec-title .kico,.chip .kico,.tab .kico,.btn .kico,.hero-date .kico{
        filter:drop-shadow(0 2px 3px rgba(118,90,196,.22))}

  /* 头像同样去掉白圈，直接融入背景 */
  .brand .brand-avatar{border:none!important;background:none!important;border-radius:0!important;
        object-fit:contain;filter:drop-shadow(0 5px 9px rgba(118,90,196,.30));
        animation:lulu-pop .7s cubic-bezier(.34,1.56,.64,1) both,lulu-float 4.4s ease-in-out 1s infinite}
  .hero .hero-avatar{border:none!important;background:none!important;border-radius:0!important;
        object-fit:contain;filter:drop-shadow(0 6px 12px rgba(118,90,196,.30));
        animation:lulu-pop .7s cubic-bezier(.34,1.56,.64,1) both,lulu-float 4s ease-in-out 1s infinite}

  /* 用独立属性做动效：浮动走 translate，悬停走 scale/rotate，互不打架 */
  @keyframes lulu-pop{0%{opacity:0;scale:.55}58%{opacity:1;scale:1.09}100%{opacity:1;scale:1}}
  @keyframes lulu-float{0%,100%{translate:0 0}50%{translate:0 -4px}}
  @keyframes lulu-hop{0%,100%{translate:0 0}35%{translate:0 -6px}62%{translate:0 -1px}84%{translate:0 -4px}}
  @keyframes lulu-sway{0%,100%{rotate:-3.5deg}50%{rotate:3.5deg}}

  /* 侧边栏：错峰弹入 + 常驻轻浮动；hover 放大回正，激活上下跳 */
  .nav-item .kico{transform:none;animation:lulu-pop .5s cubic-bezier(.34,1.56,.64,1) both,lulu-float 4.6s ease-in-out infinite;
        animation-delay:calc(var(--i,0)*38ms),calc(.85s + var(--i,0)*38ms)}
  .nav-item:hover .kico{transform:none;scale:1.2;rotate:-8deg}
  .nav-item.active .kico{transform:none;scale:1.08;
        animation:lulu-pop .5s cubic-bezier(.34,1.56,.64,1) both,lulu-hop 2.7s ease-in-out .5s infinite}
  .nav-item:active .kico{scale:.9}

  /* 概览卡：错峰浮动，hover 轻轻放大 */
  .ov-ico .kico{animation:lulu-pop .55s cubic-bezier(.34,1.56,.64,1) both,lulu-hop 3.6s ease-in-out 1.1s infinite}
  .ov-grid .ov-card:nth-child(2) .kico{animation-delay:.06s,1.4s}
  .ov-grid .ov-card:nth-child(3) .kico{animation-delay:.12s,1.7s}
  .ov-grid .ov-card:nth-child(4) .kico{animation-delay:.18s,2s}
  .ov-card:hover .kico{scale:1.12}

  /* 快捷入口：大贴纸错峰呼吸浮动，hover 摇摆放大 */
  .quick-item .kico{animation:lulu-pop .55s cubic-bezier(.34,1.56,.64,1) both,lulu-float 4.2s ease-in-out infinite;
        animation-delay:calc(var(--i,0)*48ms),calc(.85s + var(--i,0)*48ms)}
  .quick-item:hover{transform:none;translate:0 -4px}
  .quick-item:hover .em{transform:none}
  .quick-item:hover .kico{transform:none;scale:1.2;rotate:8deg}
  .quick-item:active .kico{scale:.9}

  /* 卡片整体悬停轻浮起 */
  .card{transition:translate .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s}
  .card:hover{translate:0 -3px;box-shadow:0 12px 26px rgba(122,94,200,.20)}

  /* 小标题图标轻微摇摆 */
  .sec-title .kico{animation:lulu-pop .5s cubic-bezier(.34,1.56,.64,1) both,lulu-sway 3.4s ease-in-out .8s infinite}

  /* 横幅：Dimoo 悬浮 + 小夜灯贴纸摇摆 */
  .hero-mascot .kico{animation:lulu-pop .7s cubic-bezier(.34,1.56,.64,1) both,sticker-float 4.4s ease-in-out 1s infinite}
  .hero-sticker .kico{animation:lulu-pop .7s cubic-bezier(.34,1.56,.64,1) both,lulu-sway 4.8s ease-in-out 1.2s infinite}

  @media (prefers-reduced-motion:reduce){.kico,.brand-avatar,.hero-avatar{animation:none!important}}

/* 主题切换胶囊 */
.theme-switch{
  position:fixed;right:18px;bottom:70px;z-index:400;display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:999px;cursor:pointer;text-decoration:none;
  background:rgba(255,251,246,.95);border:1px solid #E3D7FB;color:#5A4480;
  font-size:12.5px;font-weight:700;box-shadow:0 8px 20px rgba(126,98,214,.22);
  backdrop-filter:blur(8px);transition:transform .18s,box-shadow .18s;
}
.theme-switch:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(126,98,214,.3)}
.theme-switch em{font-style:normal;font-size:15px}
@media (max-width:760px){.theme-switch{right:12px;bottom:64px;padding:8px 13px;font-size:11.5px}}

html[data-theme="cream"] .kico{filter:contrast(1.1) saturate(1.08) drop-shadow(0 1px 1.5px rgba(140,96,56,.22))}
html[data-theme="cream"] .nav-item .nav-ico{
  width:40px;height:40px;border-radius:14px;
  background:linear-gradient(160deg,#FFFDF8 0%,#FAEEDB 100%);
  box-shadow:inset 0 0 0 1px rgba(226,203,168,.95),0 2px 6px rgba(150,105,62,.12);
}
html[data-theme="cream"] .nav-item .nav-ico .em{width:auto;height:auto;font-size:0;line-height:0;display:flex;align-items:center;justify-content:center}
html[data-theme="cream"] .nav-item .nav-ico .kico{width:33px;height:33px;filter:contrast(1.12) saturate(1.06) drop-shadow(0 1px 1.2px rgba(140,96,56,.2))}
html[data-theme="cream"] .nav-item.active .nav-ico{background:linear-gradient(160deg,#FFF4E0 0%,#F4DFBE 100%);box-shadow:inset 0 0 0 1px rgba(203,170,124,.95),0 4px 10px rgba(150,105,62,.18)}
html[data-theme="cream"] .nav-item.active .kico{scale:1!important}
html[data-theme="cream"] .nav-item .nav-badge{right:-4px;bottom:-4px;width:14px;height:14px;font-size:7.5px}
html[data-theme="cream"] .quick-item .em{
  width:72px;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#FFFDF8 0%,#FAEEDB 100%);
  box-shadow:inset 0 0 0 1px rgba(226,203,168,.95),0 3px 8px rgba(150,105,62,.12);
  transition:transform .18s,box-shadow .18s;
}
html[data-theme="cream"] .quick-item:hover .em{box-shadow:inset 0 0 0 1px rgba(226,203,168,1),0 6px 14px rgba(150,105,62,.18)}
html[data-theme="cream"] .quick-item .em .kico{width:60px;height:60px;filter:contrast(1.1) saturate(1.06) drop-shadow(0 1px 1.5px rgba(140,96,56,.2))}
html[data-theme="cream"] .sidebar{
  background:linear-gradient(180deg,rgba(255,248,236,.95),rgba(250,236,213,.9) 52%,rgba(242,223,190,.94));
  border-right:1.5px dashed #DDBF95;
}
html[data-theme="cream"] .brand .brand-avatar{
  width:74px;height:74px;border:none;border-radius:0;background:none;object-fit:contain;
  filter:drop-shadow(0 6px 12px rgba(160,116,72,.26));
}
html[data-theme="cream"] .brand b{color:#8A6242;letter-spacing:1.4px}
html[data-theme="cream"] .brand span{color:#B58553}
html[data-theme="cream"] .nav-item{border-radius:18px;color:#8A6444}
html[data-theme="cream"] .nav-item:hover{background:rgba(255,255,255,.94);box-shadow:0 4px 12px rgba(181,133,83,.16)}
html[data-theme="cream"] .nav-item.active{
  background:linear-gradient(135deg,#F7E3C4,#EFC793);color:#6B4525;
  box-shadow:0 8px 18px rgba(181,133,83,.28);
}
html[data-theme="cream"] .nav-item.active .nav-badge{border-color:#F5E4C7}
html[data-theme="cream"] .nav-badge{background:#FFFBF4;border-color:#E8D5B5;color:#B58553}
html[data-theme="cream"] .ver{color:#A9865E}
html[data-theme="cream"] .card{
  background:#FFFDF7;border:1px solid #DDBE92;border-radius:22px;
  box-shadow:0 6px 18px rgba(120,82,45,.16);
}
html[data-theme="cream"] .card:hover{box-shadow:0 12px 28px rgba(120,82,45,.22)}
html[data-theme="cream"] .sec-title{color:#6B4527}
html[data-theme="cream"] .hero{
  background:linear-gradient(135deg,#FCEFD8 0%,#F3DDBB 48%,#FFFAF0 100%);
  border:1px solid #DDBE92;border-radius:24px;
  box-shadow:0 10px 28px rgba(120,82,45,.18);
}
html[data-theme="cream"] .hero:before{opacity:.28;background:radial-gradient(rgba(255,255,255,.9) 2.5px, transparent 3px)}
html[data-theme="cream"] .hero-mascot .kico{animation:sheep-in .72s cubic-bezier(.34,1.56,.64,1) both, sheep-float 4.6s ease-in-out 1s infinite;
  filter:drop-shadow(0 12px 20px rgba(160,116,72,.28))}
html[data-theme="cream"] .hero-sticker{border:none;background:none;box-shadow:none;border-radius:26px}
html[data-theme="cream"] .hero-sticker .kico{filter:contrast(1.06) drop-shadow(0 8px 14px rgba(150,105,62,.3))}
html[data-theme="cream"] .bg-deco span:nth-child(1),html[data-theme="cream"] .bg-deco span:nth-child(7){display:none}
html[data-theme="cream"] .hero .float-heart.deco-orange{display:none}
html[data-theme="cream"] .hero-star.gold,html[data-theme="cream"] .hero-star.orange{color:#D9B57E}
html[data-theme="cream"] .hero-date{color:#8B6242}
html[data-theme="cream"] .hero-quote{color:#5B3A1E;text-shadow:none}
html[data-theme="cream"] .hero-sub{color:#A67B50}
html[data-theme="cream"] .hero-img{width:104px;height:104px;filter:drop-shadow(0 8px 16px rgba(150,105,62,.28))}
html[data-theme="cream"] .toast{background:linear-gradient(135deg,#D9A259,#B58553);box-shadow:0 8px 24px rgba(181,133,83,.36)}
html[data-theme="cream"] .btn{border-radius:999px}
html[data-theme="cream"] .btn.primary{background:linear-gradient(135deg,#EFC793,#D9A259);color:#5B3A1E;box-shadow:0 6px 16px rgba(181,133,83,.28)}
html[data-theme="cream"] .btn.primary:hover{box-shadow:0 10px 22px rgba(181,133,83,.34)}
@keyframes sheep-float{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-7px) rotate(1.6deg)}}
@keyframes sheep-in{0%{opacity:0;transform:translateY(14px) scale(.82)}100%{opacity:1;transform:none}}

/* ===== v5.1 · 移动端体验打磨 ===== */
/* 抽屉遮罩：点外部即可关闭，抽屉浮于顶栏之上 */
.drawer-mask{position:fixed;inset:0;z-index:75;display:none;background:rgba(92,64,51,.32);backdrop-filter:blur(2px)}
.drawer-mask.show{display:block;animation:fadein .18s ease}
@media (max-width:860px){

    chapters:[
      { title:'从百草园到三味书屋（节选）', content:'不必说碧绿的菜畦，光滑的石井栏，高大的皂荚树，紫红的桑椹；也不必说鸣蝉在树叶里长吟，肥胖的黄蜂伏在菜花上，轻捷的叫天子（云雀）忽然从草间直窜向云霄里去了。单是周围的短短的泥墙根一带，就有无限趣味。油蛉在这里低唱，蟋蟀们在这里弹琴。翻开断砖来，有时会遇见蜈蚣；还有斑蝥，倘若用手指按住它的脊梁，便会拍的一声，从后窍喷出一阵烟雾。\n\n冬天的百草园比较的无味；雪一下，可就两样了。拍雪人和塑雪罗汉需要人们鉴赏，这是荒园，人迹罕至，所以不相宜，只好来捕鸟。薄薄的雪，是不行的；总须积雪盖了地面一两天，鸟雀们久已无处觅食的时候才好。扫开一块雪，露出地面，用一支短棒支起一面大的竹筛来，下面撒些秕谷，棒上系一条长绳，人远远地牵着，看鸟雀下来啄食，走到竹筛底下的时候，将绳子一拉，便罩住了。' },
      { title:'故乡（节选）', content:'深蓝的天空中挂着一轮金黄的圆月，下面是海边的沙地，都种着一望无际的碧绿的西瓜，其间有一个十一二岁的少年，项带银圈，手捏一柄钢叉，向一匹猹尽力的刺去。那猹却将身一扭，反从他的胯下逃走了。\n\n我在朦胧中，眼前展开一片海边碧绿的沙地来，上面深蓝的天空中挂着一轮金黄的圆月。我想：希望是本无所谓有，无所谓无的。这正如地上的路；其实地上本没有路，走的人多了，也便成了路。' },
    ]},
  { id:'b4', title:'背影·荷塘月色', author:'朱自清', cat:'文学', cover:'c-mint', em:'🍃',
    intro:'现代散文的典范。父爱的背影、月下的荷塘，白话文写得这样美，读一遍心里静一遍。',
    quotes:[
      '我看见他戴着黑布小帽，穿着黑布大马褂，深青布棉袍，蹒跚地走到铁道边，慢慢探身下去。',
      '曲曲折折的荷塘上面，弥望的是田田的叶子。叶子出水很高，像亭亭的舞女的裙。',
      '热闹是它们的，我什么也没有。',
    ],
    chapters:[
      { title:'背影（节选）', content:'我与父亲不相见已二年余了，我最不能忘记的是他的背影。那年冬天，祖母死了，父亲的差使也交卸了，正是祸不单行的日子。我从北京到徐州，打算跟着父亲奔丧回家。到徐州见着父亲，看见满院狼藉的东西，又想起祖母，不禁簌簌地流下眼泪。\n\n到南京时，有朋友约去游逛，勾留了一日；第二日上午便须渡江到浦口，下午上车北去。父亲因为事忙，本已说定不送我，叫旅馆里一个熟识的茶房陪我同去。他再三嘱咐茶房，甚是仔细。但他终于不放心，怕茶房不妥帖；颇踌躇了一会。其实我那年已二十岁，北京已来往过两三次，是没有什么要紧的了。他踌躇了一会，终于决定还是自己送我去。\n\n我看见他戴着黑布小帽，穿着黑布大马褂，深青布棉袍，蹒跚地走到铁道边，慢慢探身下去，尚不大难。可是他穿过铁道，要爬上那边月台，就不容易了。他用两手攀着上面，两脚再向上缩；他肥胖的身子向左微倾，显出努力的样子。这时我看见他的背影，我的泪很快地流下来了。我赶紧拭干了泪。怕他看见，也怕别人看见。\n\n在晶莹的泪光中，又看见那肥胖的、青布棉袍黑布马褂的背影。唉！我不知何时再能与他相见！' },
      { title:'荷塘月色（节选）', content:'这几天心里颇不宁静。今晚在院子里坐着乘凉，忽然想起日日走过的荷塘，在这满月的光里，总该另有一番样子吧。\n\n曲曲折折的荷塘上面，弥望的是田田的叶子。叶子出水很高，像亭亭的舞女的裙。层层的叶子中间，零星地点缀着些白花，有袅娜地开着的，有羞涩地打着朵儿的；正如一粒粒的明珠，又如碧天里的星星，又如刚出浴的美人。微风过处，送来缕缕清香，仿佛远处高楼上渺茫的歌声似的。\n\n月光如流水一般，静静地泻在这一片叶子和花上。薄薄的青雾浮起在荷塘里。叶子和花仿佛在牛乳中洗过一样；又像笼着轻纱的梦。塘中的月色并不均匀；但光与影有着和谐的旋律，如梵婀玲上奏着的名曲。\n\n这样想着，猛一抬头，不觉已是自己的门前；轻轻地推门进去，什么声息也没有，妻已睡熟好久了。' },
    ]},
  { id:'b5', title:'影响力', author:'罗伯特·西奥迪尼', cat:'HR专业', cover:'c-sun', em:'🧲',
    intro:'社会心理学经典。六把影响力武器——互惠、承诺一致、社会认同、喜好、权威、稀缺——理解它们，招聘谈判、团队管理、甚至面试说服都会更顺。',
    quotes:[
      '人们倾向于兑现自己已经做出的承诺，哪怕这个承诺是在无意中做出的。',
      '社会认同原理：我们会参考别人怎么做，尤其当我们不确定该怎么做的时候。',
      '稀缺性：越难得到的东西，人们越想要——但稀缺应该是真的，不是制造出来的。',
    ],
    chapters:[
      { title:'六把影响力武器·实战手册', content:'① 互惠原理：给候选人多一点（面试反馈、行业洞察、内推奖金），他们会回报你——接受 offer 的概率提升 30%。\n\n② 承诺一致：面试快结束时问「如果今天就发 offer，你多久能入职？」——候选人给出的承诺越具体，真入职的概率越高。\n\n③ 社会认同：offer 邮件里放「上一批加入我们的 3 个编导候选人都来自XX公司」——同频的人会互相吸引。\n\n④ 喜好：面试时找共同点（你也喜欢徒步？我也是），候选人会更信任你，谈判更顺。\n\n⑤ 权威：谈判薪资时说「我理解你的期望，但这个职位的定级是我司薪资体系统一规定的」——权威感比讨价还价管用。\n\n⑥ 稀缺：「这个岗位本周有 3 个候选人进入终面，只有 1 个能拿到 offer」——适度的稀缺感能加速决策。' },
      { title:'招聘中的「反影响力」', content:'影响力武器管用，但要小心被候选人用在你身上。常见场景：\n\n「我手上还有好几个 offer，明天就要做决定了」——用稀缺性逼你快点拍板。但你可以说「我理解，我们也在比较最合适的人选，明早我会给你一个明确答复」。\n\n「我朋友XX也在你们公司，她说你们团队氛围特别好」——用社会认同拉近距离，但也暗含「我和你们内部有人脉，别亏待我」。正常回应即可，别被道德绑架。\n\n「我之前在XX公司是核心骨干，带过 20 人的团队」——用权威压你，但要追问「具体做了什么决策？带团队遇到最大的困难是什么？」——用行为面试法拆解包装。\n\n关键：影响力是双向的。理解它，才能不被它牵着走。' },
    ]},
  { id:'b6', title:'你当像鸟飞往你的山', author:'塔拉·韦斯特弗', cat:'文学', cover:'c-sky', em:'🕊️',
    intro:'一个从未上过学的摩门教女孩，如何通过教育走出大山、重建自我的故事。成长、觉醒、与过去和解——每个在职场中挣扎过的人都能读懂。',
    quotes:[
      '我这一生中，这些直觉一直在教导我一个道理——只有依靠自己，胜算才更大。',
      '你可以爱一个人，但仍然选择和他说再见；你可以想念一个人，但仍然庆幸他不在你的生命中。',
      '过去是一个幽灵，虚无缥缈，没什么影响力。只有未来才有分量。',
    ],
    chapters:[
      { title:'教育的本质是自我救赎', content:'塔拉 17 岁才第一次走进教室，之前她在爱达荷州的山上帮父亲拆废铁。她没有出生证明，没上过一天学，甚至不知道什么是「政府」。但她靠自学考上了杨百翰大学，后来拿到了剑桥大学博士、哈佛大学访问学者的身份。\n\n教育改变了她，但更准确地说，是她抓住了教育这个工具，亲手打碎了原生家庭给她的枷锁。她在书里写：「我这一生中，这些直觉一直在教导我一个道理——只有依靠自己，胜算才更大。」\n\nHR 招聘里有一个常见误区：只看候选人的「起点」（学历、背景、家庭），不看他们「飞过来的翅膀」。一个从大山里飞出来的女孩，翅膀可能比任何温室里的鸟都硬。' },
      { title:'与自己和解·不被过去定义', content:'塔拉花了十年时间，才和过去那个在废铁堆里长大的自己和解。她一度因为「我不应该是这样的人」而崩溃、而自我否定。但最终她明白了：过去是一个幽灵，虚无缥缈，只有未来才有分量。\n\n这本书最打动人的地方，不是「穷孩子考上名校」的励志，而是一个人如何在两种身份之间挣扎——原生家庭的「塔拉」和教育重塑的「塔拉」，哪个才是真正的自己？\n\n职场中我们也会遇到类似的身份焦虑：「我以前是技术岗，现在转 HRBP，我还够格吗？」「我以前在小公司，现在去大平台，我能跟上吗？」——塔拉的答案是：你当像鸟飞往你的山，山不是别人给的，是你自己选的。' },
    ]},
  { id:'b7', title:'活着', author:'余华', cat:'文学', cover:'c-coral', em:'🌾',
    intro:'福贵的一生，苦难堆成山，但他还是活着。余华最残忍也最温柔的书——看完会觉得，自己的那点事，真的不算什么。',
    quotes:[
      '人是为活着本身而活着，而不是为了活着之外的任何事物而活着。',
      '活着，在我们中国的语言里充满了力量，它的力量不是来自于喊叫，也不是来自于进攻，而是忍受。',
      '少年去游荡，中年想掘藏，老年做和尚。',
    ],
    chapters:[
      { title:'福贵的一生', content:'福贵是地主家的少爷，赌光了家产，气死了爹。后来被抓去当兵，又被解放军俘虏。好不容易回了家，老婆家珍得了软骨病，儿子有庆被县长抽血抽死，女儿凤霞难产死了，家珍也走了，女婿二喜工伤死了，最后只剩下他和一头老牛。\n\n余华的写法太狠了：他不让你哭，他就让你看着福贵一件一件地失去，一件一件地熬过去。没有高潮，没有反转，就是活着。\n\n但读完你会明白：活着本身就是最大的力量。不是因为你有多强，而是因为你还没有倒下。招聘中我们常常高估「优秀」，低估「韧性」——一个能扛事的人，比一个闪闪发光但一碰就碎的人，对团队的价值大得多。' },
      { title:'苦难的重量·温柔的底色', content:'《活着》里没有坏人。县长不是坏人，他只是需要血；医院的护士不是坏人，她只是按流程办事；甚至福贵自己赌光家产的时候，也不是什么十恶不赦的人。余华写的是一个没有恶的世界里，苦难照样发生。\n\n这才是最让人绝望的地方：你找不到一个可以责怪的人。但福贵不责怪，他只是活着。他对老牛说「今天有庆、二喜耕了一亩，家珍、凤霞耕了也有七八分，老子我耕了两亩半」——他把失去的人，都算进了自己的命里。\n\n职场中我们也会遇到「没有坏人但事情就是糟透了」的时刻。余华给的答案是：活着。不是躺平，是承认苦难的重量，然后继续走。' },
    ]},
  { id:'b8', title:'乌合之众', author:'古斯塔夫·勒庞', cat:'心理', cover:'c-hot-pink', em:'🫂',
    intro:'群体心理学开山之作。理解网络时代的舆论、从众与极化，先从理解「群体」开始。（本章为编者核心观点整理）',
    quotes:[
      '人一到群体中，智商就严重降低，为了获得认同，个体愿意抛弃是非，用智商去换取那份让人备感安全的归属感。',
      '群体只会干两种事——锦上添花或落井下石。',
      '影响民众想象力的，并不是事实本身，而是它扩散和传播的方式。',
    ],
    chapters:[
      { title:'群体心理·核心观点（编者整理）', content:'勒庞认为：当个体聚集成群体时，会呈现出全新的心理特征。个人的理性与独立思考被削弱，群体表现出冲动、易变、急躁，易受暗示与轻信，情绪夸张而单纯。\n\n群体的三个特征来源：一是本能，人数带来的力量感让个体敢于释放欲望；二是传染，每种情感与行动在群体中都有极强的传染性；三是易受暗示，个体如同被催眠，有意识人格消失，意志与辨别力不复存在。\n\n群体的意见与信念受三重因素影响：种族、传统、时间等间接因素，以及形象、口号与重复等直接手段。「断言、重复、传染」是群体观念扩散的三板斧——不需要逻辑，只需要反复出现。\n\n读这本书的意义不在批判大众，而在自我觉察：当我们身处群体情绪之中时，能否保留一丝独立判断的清醒。' },
    ]},
  { id:'b9', title:'好吗好的', author:'大冰', cat:'文学', cover:'c-peach', em:'🎸',
    intro:'平行世界的故事。大兵写的不是鸡汤，是真实活着的人——他们辞职去大理开客栈，搭车穿越无人区，在丽江卖唱十年。看完会想，人生还有很多活法。',
    quotes:[
      '平行世界，多元生活。既可以朝九晚五，又能够浪迹天涯。',
      '请相信，这个世界上真的有人在过着你想要的生活。',
      '缘深缘浅，缘聚缘散。惜缘即可，不必攀缘。',
    ],
    chapters:[
      { title:'平行世界·多元生活', content:'大冰在书里写了一群人：开酒吧的老兵，在丽江当背包客十年的老杨，辞职去新疆种棉花的小陈……他们不是逃离，而是选择。选择一种和「朝九晚五、买房买车、结婚生子」不同的活法。\n\n他说「平行世界，多元生活。既可以朝九晚五，又能够浪迹天涯」——这句话被很多人抄在朋友圈，但真正做到的人很少。不是做不到，是不敢。不敢放弃已经有的，不敢面对不确定的。\n\n但大冰的故事里，没有一个人后悔。不是因为他们活得比别人好，而是因为他们活得是自己的。千人电商公司的 HRBP 在面试时也会遇到这样的候选人：他们的简历上有「Gap 一年去大理开客栈」「辞职搭车走了 318」——你会担心他们不稳定，但你也会好奇：一个敢这样活的人，在工作中会不会也敢闯敢干？' },
      { title:'缘深缘浅·不攀缘', content:'大冰在书里写「缘深缘浅，缘聚缘散。惜缘即可，不必攀缘」。这句话放在招聘里特别合适：不是每个候选人都能拿到 offer，不是每个 offer 都能被接受，不是每个入职的人都能留下三年。\n\n我们常常因为「怕招不到人」而降低标准，因为「怕错过」而过度承诺，因为「怕损失」而不敢放手。但大冰的故事告诉你：缘深的人，绕一圈还会回来；缘浅的人，强留也留不住。\n\n招聘是一场缘。你做好自己该做的（精准画像、专业面试、真实展示），剩下的交给缘分。惜缘，不攀缘——这句话放在职场人际关系里同样适用。' },
    ]},
  { id:'b10', title:'HRBP实战指南', author:'丁书苗（编）', cat:'HR专业', cover:'c-sun', em:'🧭',
    intro:'HRBP 从「打杂」到「业务伙伴」的转型手册。如何和业务 leader 对话、怎么做组织诊断、如何推动招聘落地——每一章都是一线经验。',
    quotes:[
      'HRBP 的核心价值不是「做人事工作」，而是「让业务问题得到人事层面的解决」。',
      '和业务 leader 对话的前提是：你听得懂他在说什么。',
      '招聘不是把人招进来就完了，是把合适的人招进合适的位置，然后让他留下来、成长起来。',
    ],
    chapters:[
      { title:'HRBP 的三个角色', content:'HRBP 有三个角色：战略伙伴（参与业务规划，把人的问题纳入战略）、解决方案提供者（发现问题、设计方案、推动落地）、变革推动者（在组织变化时帮人适应）。\n\n但绝大多数 HR 只做到了「行政事务处理者」——发工资、上社保、办入职。从行政到业务伙伴，差的不是职位，是思维：你是在「完成 HR 任务」，还是在「解决业务问题」？\n\n举个例子：业务 leader 说「我们部门招人太慢了」。行政思维：「好的，我加大招聘力度」。HRBP 思维：「招人慢是因为什么？是简历少？还是面试通过率低？还是 offer 接受率低？我们一起把漏斗拉出来看看」。' },

/* ---------- 云同步（jsonbin.io） ---------- */
async function cloudGet(){
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    cache:'no-store', headers:{ 'X-Access-Key': ACCESS_KEY }
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GET ' + res.status);
  const json = await res.json();
  const rec = json && json.record ? json.record : json;
  if (!rec || rec._app !== 'alin-desk') return null;
  lastColdGz = rec._cold_gz || '';                    // 冷区（gzip 归档）交给 hydrateCold 解压
  const { _cold_gz, ...state } = rec;
  return { ...emptyState(), ...state };
}
async function cloudPut(state){
  let coldGz = lastColdGz;                            // 浏览器不支持压缩时原样保留旧冷区
  if (coldOK) {
    try { coldGz = Object.values(S_ARCH).some(a => a && a.length) ? await gzPack(S_ARCH) : ''; } catch(e){ coldGz = lastColdGz; }
  }
  const body = { ...state, _cold_gz: coldGz, _syncedAt: Date.now(), _localSavedAt: Date.now() };
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method:'PUT', headers:{ 'Content-Type':'application/json', 'X-Access-Key': ACCESS_KEY },
    body: JSON.stringify(body)
  });
  if (res.status === 413) throw new Error('云端存储空间不足');
  if (res.status === 429) throw new Error('云端请求太频繁，稍后自动重试');
  if (!res.ok) throw new Error('上传失败(' + res.status + ')');
  S = { ...S, _syncedAt: body._syncedAt }; saveLocal();
  cloudErr = ''; lastSyncAt = body._syncedAt; cloudOK = true;
}
function mergeStates(a, b){
  const del = new Set([...(a._deleted||[]), ...(b._deleted||[])]);
  const uni = (x, y) => {
    const m = new Map();
    (y||[]).forEach(it => { if (it && it.id && !del.has(it.id)) m.set(it.id, it); });
    (x||[]).forEach(it => { if (it && it.id && !del.has(it.id)) m.set(it.id, it); });
    return [...m.values()];
  };
  /* 抓取任务执行记录：取最近更新的 */
  const jobs = { ...(b.jobs||{}) };
  Object.entries(a.jobs||{}).forEach(([k,v]) => {
    const o = jobs[k];
    jobs[k] = !o || (v.lastTs||0) >= (o.lastTs||0) ? v : o;
  });
  /* 书架：逐本取更新时间新的 */
  const shelf = { ...(b.shelf||{}) };
  Object.entries(a.shelf||{}).forEach(([k,v]) => {
    const o = shelf[k];
    shelf[k] = !o || (v.updatedAt||0) >= (o.updatedAt||0) ? v : o;
  });
  const feeds = (a.feeds && a.feeds.length) ? a.feeds : (b.feeds && b.feeds.length ? b.feeds : JSON.parse(JSON.stringify(DEFAULT_FEEDS)));
  return {
    ...a,
    bills: uni(a.bills, b.bills), diet: uni(a.diet, b.diet), todos: uni(a.todos, b.todos),
    events: uni(a.events, b.events), workouts: uni(a.workouts, b.workouts),
    knowledge: uni(a.knowledge, b.knowledge), hotspots: uni(a.hotspots, b.hotspots),
    kb: uni(a.kb, b.kb), automations: uni(a.automations, b.automations),
    reminders: (()=>{ const u = uni(a.reminders, b.reminders); const seen = new Set(); return u.filter(r => { const k = (r.time||'')+'|'+(r.text||'')+'|'+(r.repeat||'')+'|'+((r.weekdays||[]).join(',')); if(seen.has(k)) return false; seen.add(k); return true; }); })(), notes: uni(a.notes, b.notes),
    plans: uni(a.plans, b.plans),
    gz: (b.gz && b.gz.length) ? b.gz : uni(a.gz, b.gz), reviews: uni(a.reviews, b.reviews),
    kbInsights: (()=>{ const u = uni(a.kbInsights||[], b.kbInsights||[]); const norm = s => String(s||'').replace(/[\s\p{P}]+/gu,'').toLowerCase(); const seen = new Set(); return u.filter(x=>{ const k = (x.module_type||'')+'|'+norm(x.title); if(seen.has(k)) return false; seen.add(k); return true; }); })(),
    vdCfg: ((a._keyClearedAt||0) > (b._syncedAt||0)) ? (a.vdCfg||{}) :
           ((a._localSavedAt||0) >= (b._localSavedAt||0) ? (a.vdCfg||{}) : (b.vdCfg||{})),
    healthChecks: (a._localSavedAt||0) >= (b._localSavedAt||0) ? (a.healthChecks||{}) : (b.healthChecks||{}),

    /* 每日自动抓取产物：按 ts 取新的；boardsHist 字典合并后留最近 7 天 */
    boards: ((b.boards||{}).ts||0) >= ((a.boards||{}).ts||0) ? (b.boards||{}) : (a.boards||{}),
    boardsHist: Object.entries({ ...(a.boardsHist||{}), ...(b.boardsHist||{}) })
      .sort().slice(-7).reduce((o,[k,v])=>{ o[k]=v; return o; }, {}),
    dailyNews: ((b.dailyNews||{}).ts||0) >= ((a.dailyNews||{}).ts||0) ? (b.dailyNews||{}) : (a.dailyNews||{}),
    newsErr:   ((b.newsErr||{}).ts||0) >= ((a.newsErr||{}).ts||0) ? (b.newsErr||{}) : (a.newsErr||{}),
    boardErr:  ((b.boardErr||{}).ts||0) >= ((a.boardErr||{}).ts||0) ? (b.boardErr||{}) : (a.boardErr||{}),

async function syncNow(){
  try {
    const remote = await cloudGet();
    if (remote) { S = mergeStates(S, remote); }
    await hydrateCold();        // 解压云端冷区并入 S_ARCH
    applyColdCaps();            // 热区截断：溢出项移入 S_ARCH，保证 PUT 体积达标
    saveLocal();
    await cloudPut(S); dirty = false; cloudUploading = false; renderAll();
  } catch(e){
    cloudErr = (e instanceof TypeError) ? '网络不可用，数据已保存在本地' : e.message;
    cloudUploading = false; cloudOK = false; renderAll();
  }
}
let pushTimer = null;
function schedulePush(){
  if (!S.settings.cloud) return;
  cloudUploading = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(syncNow, SYNC_DEBOUNCE);
  updateSyncPill();
}
async function backgroundSync(){
  if (!S.settings.cloud) return;
  try {
    if (dirty) { await syncNow(); dirty = false; }
    else {
      const remote = await cloudGet();
      if (remote && (remote._syncedAt||0) > (S._syncedAt||0)) { S = remote; saveLocal(); renderAll(); }
      cloudOK = true; cloudErr = '';
    }
  } catch(e){
    if (e instanceof TypeError) cloudErr = '网络不可用，数据已保存在本地';
  }
  updateSyncPill();
}
function startAutoSync(){
  setInterval(() => { if (document.visibilityState === 'visible') backgroundSync(); }, SYNC_INTERVAL);
  const onVis = () => { if (document.visibilityState === 'visible') backgroundSync(); };
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('focus', onVis);
}
function loadStore(){
  let hasLocal = false;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed._app === 'alin-desk') { S = { ...emptyState(), ...parsed }; hasLocal = true; }
    }
  } catch(e){}
  if (!S.feeds || !S.feeds.length) S.feeds = JSON.parse(JSON.stringify(DEFAULT_FEEDS));
  /* 无本地缓存时从空白状态开始：绝不预填任何演示/假数据，打卡与记账只由用户手动提交产生 */
  if (!hasLocal) S = emptyState();
  /* reminders 启动时自动去重（按 time+text+repeat+weekdays 四元组） */
  { const seen = new Set(); const deduped = []; (S.reminders||[]).forEach(r => { const k = (r.time||'')+'|'+(r.text||'')+'|'+(r.repeat||'')+'|'+((r.weekdays||[]).join(',')); if (!seen.has(k)) { seen.add(k); deduped.push(r); } }); if (deduped.length !== (S.reminders||[]).length) { S = { ...S, reminders: deduped }; } }
  saveLocal();
  (async () => {
    if (!S.settings.cloud) { updateSyncPill(); return; }
    try {
      const remote = await cloudGet();
      if (hasLocal) {
        const localNewer = (S._localSavedAt||0) > (S._syncedAt||0);
        if (!localNewer && remote && (remote._syncedAt||0) >= (S._syncedAt||0)) {
          S = mergeStates(S, remote); saveLocal(); lastSyncAt = S._syncedAt; cloudOK = true;
        } else { await syncNow(); dirty = false; }
      } else {
        const remoteHasData = remote && (
          (remote.bills?.length||0) + (remote.diet?.length||0) + (remote.todos?.length||0) +
          (remote.events?.length||0) + (remote.workouts?.length||0) + (remote.knowledge?.length||0) +
          (remote.hotspots?.length||0) + (remote.kb?.length||0) + (remote.notes?.length||0) > 0);
        if (remoteHasData) { S = mergeStates(S, remote); saveLocal(); lastSyncAt = S._syncedAt; cloudOK = true; }
        else { await syncNow(); dirty = false; }
      }
      cloudErr = '';
    } catch(e){
      cloudErr = (e instanceof TypeError) ? '网络不可用，当前离线模式' : e.message;
      cloudOK = false;
    }
    await hydrateCold();         // 解压云端冷区（gzip 归档），历史内容照常显示
    applyColdCaps();             // 热区截断，防止本地旧数据把云端记录撑回 100KB+
    saveLocal();
    renderAll(); updateSyncPill();
    ensureBoards(false, true);    // 每日热榜（当天已抓则跳过）
    ensureDailyNews(false, true); // 每日资讯（当天已抓则跳过）
    setTimeout(runDueJobs, 4000); // 启动后检查抓取任务
    setTimeout(runDueAI, 9000);   // 热榜就绪后检查 AI 每日生成任务
  })();
  startAutoSync();
}
function updateSyncPill(){
  const pill = document.getElementById('syncPill'), txt = document.getElementById('syncText');
  const off = !S.settings.cloud || !!cloudErr;
  pill.classList.toggle('off', off);
  txt.textContent = !S.settings.cloud ? '云同步已关闭 · 仅本地'
    : cloudErr ? '离线模式 · 数据已保存本地'
    : cloudUploading ? '正在同步…'
    : lastSyncAt ? '云端已连接 · ' + new Date(lastSyncAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) + ' 同步'
    : '云端已连接 · 多设备同步中';
}

function kico(id, s){
  s = s || 22;
  let src;
  if (document.documentElement.dataset.theme === "cream") {
    const a = CREAM_KEY[id] || CREAM_KEY.home;
    src = (s >= 34 ? CREAM_FULL : CREAM_HEAD)[a] || CREAM_HEAD[a];
  } else {
    src = KICO_IMG[id] || KICO_IMG.home;
  }
  return `<img class="kico" src="${src}" width="${s}" height="${s}" alt="" draggable="false">`;
}

function applyTheme(key, keepScroll){
  const t = THEMES[key] ? key : 'dimoo';
  document.documentElement.dataset.theme = t;
  const m = THEMES[t];
  document.title = m.title;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', m.themeColor);
  const bb = document.querySelector('.brand b'), bs = document.querySelector('.brand span'),
        ver = document.querySelector('.ver'), mob = document.querySelector('.mobile-top b'),
        ba = document.getElementById('brandAvatar'), sw = document.getElementById('themeSwitch');
  if (bb) bb.textContent = m.brand;
  if (bs) bs.textContent = m.sub;

/* ---------- 业务查询 ---------- */
/* ---------- 冷数据归档（主库内 gzip 压缩）：超上限的旧内容压进 _cold_gz 字段，dt() 读取时解压合并 ---------- */
/* 双向强制上限：浏览器端 syncNow 与 7:30 任务端都会执行「热区截断 → 溢出并入 _cold_gz」，
   保证云端记录永远 <96KB（jsonbin 免费版上限 100KB），且历史内容不丢失、前端照常显示 */
const COLD_COLL = ['kbInsights','workouts','hotspots','kb'];
const COLD_CAPS = { kbInsights:14, workouts:30, hotspots:8, kb:10 };
const coldOK = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
let S_ARCH = { kbInsights:[], workouts:[], hotspots:[], kb:[] };
let archLoaded = false, lastColdGz = '';
const _coldKey = x => x && x.id;
const _coldSort = (a,b) => String(b.created_at||b.date||b.added_at||b.record_date||'').localeCompare(String(a.created_at||a.date||a.added_at||a.record_date||''));
async function gzPack(obj){
  const data = new TextEncoder().encode(JSON.stringify(obj));
  const stream = new Blob([data]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function gzUnpack(b64){
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const stream = new Blob([arr]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
async function hydrateCold(){
  if (!coldOK || !lastColdGz || archLoaded) { archLoaded = true; return S_ARCH; }
  try {
    const cold = await gzUnpack(lastColdGz);
    COLD_COLL.forEach(k => {
      const list = Array.isArray(cold[k]) ? cold[k] : [];
      const ids = new Set(S_ARCH[k].map(_coldKey));
      list.forEach(x => { if (_coldKey(x) && !ids.has(x.id)) S_ARCH[k].push(x); });
    });
  } catch(e){ /* 冷区损坏时静默降级：仅显示热区 */ }
  archLoaded = true; return S_ARCH;
}
function applyColdCaps(){
  if (!coldOK) return;
  COLD_COLL.forEach(k => {
    const arr = S[k];
    if (!Array.isArray(arr)) return;
    const cap = COLD_CAPS[k] || 0;
    if (arr.length <= cap) return;
    const sorted = [...arr].sort(_coldSort);
    const hot = sorted.slice(0, cap), overflow = sorted.slice(cap);
    const ids = new Set(S_ARCH[k].map(_coldKey));
    overflow.forEach(x => { if (_coldKey(x) && !ids.has(x.id)) S_ARCH[k].push(x); });
    S[k] = hot;      // 注意：直接赋值而非 update()，避免触发同步循环；由调用方 saveLocal/PUT
  });
}
const dt = s => {
  const base = S[s];
  if (!Array.isArray(base)) return base || [];
  const arch = S_ARCH[s];
  if (!arch || !arch.length) return base;
  const del = new Set(S._deleted || []);
  const mainIds = new Set(base.map(x => x && x.id).filter(Boolean));
  return [...base, ...arch.filter(x => x && x.id && !mainIds.has(x.id) && !del.has(x.id))];
};
function todosOf(date){ return dt('todos').filter(t => t.todo_date === date); }
function eventsOf(date){ return dt('events').filter(e => e.event_date === date).sort((a,b)=>(a.start_time||'').localeCompare(b.start_time||'')); }
function dietOf(date){ return dt('diet').filter(d => d.record_date === date); }
function billsOf(date){ return dt('bills').filter(b => b.record_date === date).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')); }
function workoutsOf(date){ return dt('workouts').filter(w => w.record_date === date); }
function workoutStreak(){
  let n = 0; const d = new Date();
  const has = () => dt('workouts').some(w => w.record_date === d.toISOString().slice(0,10));
  if (!has()) d.setDate(d.getDate() - 1);
  while (dt('workouts').some(w => w.record_date === d.toISOString().slice(0,10))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function dashStats(){
  const t = today(), todos = todosOf(t), diet = dietOf(t);
  return {
    date: t,

}

function saveBoardHot(key, idx){
  const x = (((S.boards||{}).boards||{})[key]||[])[idx];

  const name = '精选新闻';
  const cat = x.c ? `（${x.c}）` : '';

    id: uid(), fetch_date: today(), title: x.t,

    source: name, hot_rank: idx+1, url: x.l||''

    <div class="field"><label>标题</label><input type="text" id="f-kn-title"></div>
    <div class="field-row">
      <div class="field"><label>分类</label><input type="text" id="f-kn-cat" placeholder="如：人力资源"></div>
      <div class="field"><label>日期</label><input type="date" id="f-kn-date" value="${today()}"></div>
    </div>
    <div class="field"><label>内容</label><textarea id="f-kn-content"></textarea></div>
    <div class="field"><label>来源链接（可选）</label><input type="text" id="f-kn-url"></div>`, () => {
    const title = document.getElementById('f-kn-title').value.trim();
    if (!title) { toast('标题不能为空'); return; }
    const item = { id:uid(), publish_date:document.getElementById('f-kn-date').value||today(),
      category:document.getElementById('f-kn-cat').value.trim(), title,

}

/* ---------- 模拟招聘全流程（面试官 / 需求对接会 / 谈薪博弈，AI 扮演对手+教练，无 Key 降级自评） ---------- */
const MK_SYS_PROMPT = `你是电商行业编导岗的资深面试教练，服务日化家清公司（品牌：沫檬、康思嘉、驱大侠）的 HR。
面试官用 6 大追问维度考核编导候选人：①爆款框架 ②前三秒画面和要素 ③为什么采用这些画面要素 ④前三秒留住什么受众人群 ⑤后面衔接什么画面继续吸引 ⑥爆了之后怎么迭代。
给你：面试官的问题 + 候选人的回答。请评估回答质量并输出：
{"stars":1到5的整数,"verdict":"80~150字点评：先判真实水平（真操盘手/疑似注水/模糊），引用回答中的关键证据（有数据基线/A-B测试逻辑/算法机制理解=真；只有感觉/套模板/团队功劳说成个人=水）","followups":["下一步追问建议1","追问建议2","追问建议3"]}
评分锚点：5分=数据基线+A-B测试逻辑+算法机制+失败迭代案例；4分=数据清晰但迭代浅；3分=结构清楚但缺数字；2分=概念堆砌；1分=空谈感觉。
followups 必须针对回答中最薄弱的环节，具体到可以现场直接问出口。严格输出 JSON，不要输出任何其他文字。`;
const MK_BIZ_SYS = `你是「模拟招聘全流程」训练器，本轮模式＝需求对接会，双角色扮演：
1) 业务方「王总」：强势的电商运营总监，来提需求——要招一个"能打爆款的编导"，下周一必须到岗。他团队 5 个编导最近 3 个月只出过 1 条 5 万播放的视频，他坚称"就是缺人"。你要埋的坑：真实病根是内容无方法论＋他自己不会带人（伪需求）。
2) 教练：每轮回复末尾另起一段【教练点评】，点评 HR 这句应对的"打假功力"（0-10 分）＋一句改进建议。点评锚定需求合理性四步：①拷问初心（为什么招/不招会怎样/新人第一天干什么）②拆解岗位（必备vs期望/3个月3件核心产出/团队与汇报线对齐）③市场反馈（薪酬对标/人才供给/小范围测试简历量）④风险排查（职责模糊/需求反复/合规背调），核心逻辑=先问"为什么招"→再问"干什么"→最后问"值不值"。
规则：王总语气要真实施压（"业务等着，人呢？""别的部门都招到了"）；对 HR 的鉴别类提问（成功标准/现有人差在哪/预算砍半测试）给出真实但隐晦的回答，被戳中时轻微松动但不轻易承认；HR 表现好时逐步从"要人"转向"愿意聊病根"。全程中文，单次回复不超过 220 字。`;
const MK_OFFER_SYS = `你是「模拟招聘全流程」训练器，本轮模式＝谈薪博弈，双角色扮演：
1) 候选人「小李」：我司编导岗终面通过者，手握两个 Offer——A 家（竞对经销商体系）总包高 30%，B 家（头部 MCN）给期权。小李其实更看重我司的品牌化机会，但会不断用 A 家压价。
2) 教练：每轮回复末尾另起一段【教练点评】，点评 HR 的谈薪动作（0-10 分）＋一句改进建议（是否摸清动机排序/是否用职业机会维度对冲价格维度/是否守住底线没乱加价）。
规则：小李对"涨薪 30% 才来"立场强硬；HR 用发展空间/项目/团队维度对冲时会松动；HR 直接加价则得寸进尺报出"A 家追加了 35%"。全程中文，单次回复不超过 220 字。`;
let mkState = { q:'', answer:'', result:null, busy:false };
let mkChat = null;
const MK_CHAT_OPEN = {
  biz:'（王总推门进来，把外套往椅子上一搭）小X啊，人呢？编导这个事不能再拖了——下周一必须到岗。我团队五个编导，三个月就出过一条五万播放的，全都不行，就是缺一个能打的。你赶紧给我招，要求不高：能出爆款、能扛事、来了就上手。别的我不管。',
  offer:'（小李坐下来，语气客气但底气十足）HR 您好，感谢认可。我的情况您也知道——A 家给我总包涨 30%，B 家还有期权。咱们这个品牌化的机会我确实有兴趣，但说实话，30% 的差距我很难忽略。您看，这边能给我多少？'
};

        <b>🤼 需求对接会 · AI 扮演刁钻业务方</b><div class="small muted" style="margin-top:3px">王总上门要人："能打爆款的编导，下周一到岗！"——识别伪需求、打假病根，教练逐轮点评</div></div>

        <b>💰 谈薪博弈 · AI 扮演手握多 Offer 的候选人</b><div class="small muted" style="margin-top:3px">小李手握竞对 +30% 的 Offer 不断压价——练一轮试探与二轮博弈，教练逐轮点评</div></div>

function openMockInterview(){
  const q = IV_SIX[Math.floor(Math.random()*IV_SIX.length)];
  mkState = { q, answer:'', result:null, busy:false };
  openModal('🎭 模拟面试官', `
    <div class="small muted" style="margin-bottom:4px">随机抽中 6 大追问维度之一（可关掉重开换题）</div>
    <div style="padding:10px 12px;background:linear-gradient(135deg,#F8F5FF,#EFEAFF);border:1px solid #E3D7FB;border-radius:12px;font-weight:700;font-size:15px">🎤 ${esc(q)}</div>
    <div class="field" style="margin-top:10px"><label>候选人的回答（粘贴或口述记录）</label><textarea id="f-mk-ans" style="min-height:110px" placeholder="把候选人的回答原话记进来，AI 教练按黄金/水货标准评分，并给下一步追问"></textarea></div>
    <div id="mk-res"></div>`, () => mkScore());
}
function mkScore(){
  const ans = (document.getElementById('f-mk-ans')||{}).value || '';
  if (!ans.trim()) { toast('先输入候选人的回答'); return; }
  mkState.answer = ans.trim();
  const box = document.getElementById('mk-res'); if (!box) return;
  const cfg = S.vdCfg||{};
  if (!cfg.apiKey) { box.innerHTML = mkRubricHTML('未配置 AI Key，已切换自评模式'); return; }
  mkState.busy = true;
  box.innerHTML = '<div class="small muted" style="padding:10px 0">🌙 AI 教练正在按黄金/水货标准评估，约 10~20 秒…</div>';
  fetchWithTimeout(cfg.apiUrl||'https://api.deepseek.com/v1/chat/completions', 60000, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.apiKey },
    body: JSON.stringify({ model:cfg.model||'deepseek-chat', temperature:0.4, messages:[
      { role:'system', content: MK_SYS_PROMPT },
      { role:'user',   content: `面试问题：${mkState.q}\n候选人回答：${mkState.answer}` } ] })
  }).then(r=>r.json()).then(j=>{
    let txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    txt = txt.replace(/```json|```/g,'').trim();
    const m = txt.match(/\{[\s\S]*\}/);
    const d = JSON.parse(m ? m[0] : txt);
    mkState.result = { stars: Math.max(1,Math.min(5,+d.stars||3)), verdict:d.verdict||'', followups:d.followups||[] };
    mkState.busy = false;
    box.innerHTML = mkResultHTML(mkState.result);
    toast('评分完成 🌙');
  }).catch(()=>{
    mkState.busy = false;
    box.innerHTML = mkRubricHTML('AI 通道异常，已切换自评模式');
  });
}
function mkResultHTML(d){
  const stars = '★'.repeat(d.stars) + '☆'.repeat(5-d.stars);
  const starCls = d.stars>=4 ? '#2b8a3e' : (d.stars===3 ? '#8E74D6' : '#c92a2a');
  return `<div style="margin-top:10px;padding:11px 13px;border-radius:12px;background:#f8f9fe;border:1px solid #e3e8f5">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:20px;letter-spacing:2px;color:${starCls}">${stars}</span>
      <b class="small" style="color:${starCls}">${d.stars}/5 星 · ${d.stars>=4?'✅ 偏真人操盘':(d.stars===3?'⚠️ 存疑，继续深挖':'🚩 水货信号强')}</b>
    </div>
    <div class="small" style="margin-top:7px;white-space:pre-wrap;line-height:1.75">${esc(d.verdict)}</div>
    ${(d.followups||[]).length?`<div class="small" style="margin-top:9px;font-weight:700">⚡ 下一步追问建议</div>
      ${d.followups.map((f,i)=>`<div class="small" style="margin-top:4px;line-height:1.7">${i+1}. ${esc(f)}</div>`).join('')}
      <div style="text-align:right;margin-top:8px"><button class="btn sm" onclick="mkCopyFollowups()">📋 复制追问链</button></div>`:''}
  </div>`;
}
function mkRubricHTML(reason){
  return `<div style="margin-top:10px;padding:11px 13px;border-radius:12px;background:#F6F1FF;border:1px solid #E9E0FF">
    <div class="small" style="font-weight:700">🧭 ${esc(reason)}——对照黄金回答标准人工评分</div>
    ${['有明确数据指标（3 秒跳出/完播/GPM 基线）','有 A/B 测试逻辑与变量记录','懂算法推荐机制（流量池递进）','有失败迭代案例与"我"的具体动作'].map(i=>`<div class="small" style="margin-top:4px">☐ ${esc(i)}</div>`).join('')}
    <div class="small muted" style="margin-top:6px">命中 4 项=5星 ｜ 3 项=4星 ｜ 2 项=3星 ｜ 1 项=2星 ｜ 0 项=1星</div>
  </div>`;
}
function mkCopyFollowups(){
  const d = mkState.result; if (!d) return;
  copyText(`【模拟面试官】问题：${mkState.q}\n评分：${d.stars}/5\n点评：${d.verdict}\n\n下一步追问：\n${(d.followups||[]).map((f,i)=>`${i+1}. ${f}`).join('\n')}`, '追问链已复制 🌙');
}
function mkOpenChat(mode){
  mkChat = { mode, msgs:[{ role:'assistant', content:MK_CHAT_OPEN[mode] }], busy:false, review:null };
  openModal(mode==='biz' ? '🤼 需求对接会 · 对手：王总' : '💰 谈薪博弈 · 对手：小李', `
    <div class="small muted" style="margin-bottom:6px">${mode==='biz'
      ?'场景：王总要"能打爆款的编导"下周一到岗——识别伪需求、打假病根（缺人/缺方法/缺管理）。'
      :'场景：小李手握竞对 +30% Offer 压价——先摸动机排序，再用职业机会维度对冲价格维度。'} AI 每轮回复自带【教练点评】，点「保存」发送你的回应。</div>
    <div id="mk-chat" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:2px"></div>
    <div class="field" style="margin-top:10px"><textarea id="f-mk-chat" style="min-height:70px" placeholder="作为 HR，你会怎么回应？（点「保存」发送）"></textarea></div>
    <div id="mk-extra"></div>`, () => mkSend());
  mkRenderChat();
}
function mkRenderChat(){
  const box = document.getElementById('mk-chat'); if (!box || !mkChat) return;
  box.innerHTML = mkChat.msgs.map(m=>{
    if (m.role==='user') return `<div class="small" style="align-self:flex-end;max-width:88%;background:linear-gradient(135deg,#F8F5FF,#EFEAFF);border:1px solid #E3D7FB;border-radius:12px 12px 3px 12px;padding:8px 11px;white-space:pre-wrap;line-height:1.7">${esc(m.content)}</div>`;
    const parts = String(m.content).split('【教练点评】');
    return `<div style="align-self:flex-start;max-width:94%">
      <div class="small" style="background:#f8f9fe;border:1px solid #e3e8f5;border-radius:12px 12px 12px 3px;padding:8px 11px;white-space:pre-wrap;line-height:1.7">${esc(parts[0].trim())}</div>
      ${parts[1]?`<div class="small" style="margin-top:4px;background:#F6F1FF;border:1px solid #E9E0FF;border-radius:10px;padding:7px 10px;white-space:pre-wrap;line-height:1.7"><b>🧭 教练点评</b>${esc(parts[1].trim())}</div>`:''}
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
  const ex = document.getElementById('mk-extra');
  if (ex) ex.innerHTML = mkChat.review ? mkReviewHTML(mkChat.review)
    : `<div style="margin-top:8px;display:flex;gap:6px;justify-content:flex-end">
        <button class="btn sm" onclick="mkCopyTranscript()">📋 复制对话</button>
        <button class="btn sm" onclick="mkEndReview()">🏁 结束复盘</button></div>`;
}
function mkAiCall(messages){
  const cfg = S.vdCfg||{};
  return fetchWithTimeout(cfg.apiUrl||'https://api.deepseek.com/v1/chat/completions', 60000, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.apiKey },
    body: JSON.stringify({ model:cfg.model||'deepseek-chat', temperature:0.7, messages })
  });
}
function mkSend(){
  if (!mkChat || mkChat.busy || mkChat.review) return;
  const ta = document.getElementById('f-mk-chat'); if (!ta) return;
  const txt = ta.value.trim(); if (!txt) { toast('先输入你的回应'); return; }
  mkChat.msgs.push({ role:'user', content:txt }); ta.value='';
  const cfg = S.vdCfg||{};
  if (!cfg.apiKey) {
    mkChat.review = { checklist:true, mode:mkChat.mode };
    mkRenderChat(); toast('未配置 AI Key，已切换自评对照模式'); return;
  }
  mkChat.busy = true;
  const box = document.getElementById('mk-chat');
  if (box) box.insertAdjacentHTML('beforeend','<div class="small muted" id="mk-wait" style="padding:4px 0">🌙 对方正在回应…</div>');
  mkAiCall([{ role:'system', content: mkChat.mode==='biz'?MK_BIZ_SYS:MK_OFFER_SYS },
    ...mkChat.msgs.map(m=>({ role:m.role, content:m.content }))])
  .then(r=>r.json()).then(j=>{
    mkChat.busy = false;
    const txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '（对方沉默了…再试一次或检查 AI 设置）';
    mkChat.msgs.push({ role:'assistant', content:txt });
    mkRenderChat();
  }).catch(()=>{
    mkChat.busy = false;
    mkChat.msgs.push({ role:'assistant', content:'（AI 通道异常，请检查 ⚙ AI 设置后重试）【教练点评】本次对话已保底记录，可对照自评清单复盘。' });
    mkRenderChat();
  });
}
function mkEndReview(){
  if (!mkChat || mkChat.busy) return;
  if (mkChat.msgs.filter(m=>m.role==='user').length===0) { toast('至少过一招再复盘'); return; }
  const cfg = S.vdCfg||{};
  if (!cfg.apiKey) { mkChat.review = { checklist:true, mode:mkChat.mode }; mkRenderChat(); return; }
  mkChat.busy = true;
  const box = document.getElementById('mk-chat');
  if (box) box.insertAdjacentHTML('beforeend','<div class="small muted" id="mk-wait" style="padding:4px 0">🌙 教练正在写复盘…</div>');
  mkAiCall([{ role:'system', content: mkChat.mode==='biz'?MK_BIZ_SYS:MK_OFFER_SYS },
    ...mkChat.msgs.map(m=>({ role:m.role, content:m.content })),
    { role:'user', content:'【系统指令】模拟到此结束。请以教练身份输出最终复盘，只输出 JSON：{"stars":1到5的整数,"summary":"80字内总评","improve":["改进建议1","改进建议2","改进建议3"]}' }])
  .then(r=>r.json()).then(j=>{
    let txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    txt = txt.replace(/```json|```/g,'').trim();
    const m = txt.match(/\{[\s\S]*\}/);
    const d = JSON.parse(m ? m[0] : txt);
    mkChat.busy = false;
    mkChat.review = { stars: Math.max(1,Math.min(5,+d.stars||3)), summary:d.summary||'', improve:d.improve||[] };
    mkRenderChat(); toast('复盘完成 🌙');
  }).catch(()=>{
    mkChat.busy = false;
    mkChat.review = { checklist:true, mode:mkChat.mode };
    mkRenderChat();
  });
}

      const steps = [

          '不招会怎样？工作量真饱和了吗？能否用流程优化/分工调整解决',
          '灵魂拷问：新人第一天上班具体干什么——答不清=岗位没拆好'] },
        { name:'第二步 · 拆解岗位（画像画准）', items:[
          '"必备"和"期望"分开了吗？别把期望全写成必须，范围会缩太窄',
          '入职 3 个月必须交付的 3 件关键产出明确了吗？',
          '团队短板是什么？汇报对象/协作团队对齐了吗？'] },
        { name:'第三步 · 市场反馈（值不值）', items:[
          '薪酬与市场行情对标了吗？预算有没有竞争力？',

        { name:'第四步 · 风险排查（发布前）', items:[
          '职责是否模糊？（新人快速离职的主因）',
          '用人需求是否反复修改？（说明业务方自己没想清楚）',
          '合规检查：无歧视性条款；关键岗位背调环节已规划'] } ];

/* 统一错误文案：不暴露技术细节，给出可执行的下一步 */
function aiErr(e){
  const m = String(e && e.message || e || '');
  if (/401|403|invalid.*key|unauthor/i.test(m)) return 'Key 无效或已过期（可留空，改用内置模式）';
  if (/429|quota|余额|额度|insufficient/i.test(m)) return '当前模型额度已耗尽，请稍后再试';
  if (/timeout|abort/i.test(m)) return '请求超时，请稍后再试';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return '网络不可用，已切换内置模式';
  return m || '请求失败';
}
function copyText(t, tip){
  const done = () => toast(tip || '已复制到剪贴板 🌙');
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = t;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败，请手动选择文本'); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    let settled = false;
    navigator.clipboard.writeText(t).then(()=>{ settled = true; done(); }, ()=>{ if(!settled){ settled = true; fallback(); } });
    /* 部分环境 clipboard API 挂起不返回，超时走兜底 */
    setTimeout(()=>{ if(!settled){ settled = true; fallback(); } }, 1500);
  } else fallback();
}

function toggleHabit(id){
  const t = today();
  const map = { ...(S.healthChecks||{}) };
  const cur = new Set(map[t]||[]);
  cur.has(id) ? cur.delete(id) : cur.add(id);
  map[t] = [...cur];
  update({ ...S, healthChecks: map });
}
function healthStreak(){
  let n = 0, d = today();
  while (healthChecksOf(d).length >= 3) { n++; d = addDays(d,-1); if (n > 365) break; }
  return n;
}

        </div>
      </div>

      </div>
      <div style="padding:0 22px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
